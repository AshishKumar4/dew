[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# build.sh names the CUDA major: dew-flash-attn-cu12 or dew-flash-attn-cu13.
name = "dew-flash-attn-cuXX"
version = "0.3.12"
description = "FlashAttention for JAX: Dao-AILab's CUDA kernels as XLA FFI targets"
readme = "README.md"
license = "BSD-3-Clause AND Apache-2.0"
license-files = ["LICENSE*"]
requires-python = ">=3.11"
dependencies = ["jax>=0.11.2"]

[project.urls]
Source = "https://github.com/AshishKumar4/dew/tree/main/kernels/flash_attn"

[project.entry-points."dew.kernel_wheels"]
# A process loading a program compiled ahead traces no call that would register this wheel's FFI targets, so
# Dew calls every callable of this group first (dew.training.ahead).
dew_flash_attn = "dew_flash_attn:registered"

[tool.setuptools]
packages = ["dew_flash_attn"]

[tool.setuptools.package-data]
dew_flash_attn = ["libdew_flash_attn.so", "libdew_flash_attn3.so"]
