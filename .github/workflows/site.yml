# Builds dewml.dev on every change to what it is made of, and fails on a broken
# link, a notebook without its outputs, a public module without an API page or
# a registered model family the model list does not name. A ci/** push builds
# and checks it beside CI and keeps the build as its artifact `site`.
#
# Deploys are manual, from that artifact of the commit main is at:
#   gh run download <run> -n site -D site/dist && (cd site && pnpm run deploy)
#   (cd site && node live/deploy.mjs <commit> -- --secrets-file <live secrets>)

name: Site

on:
  push:
    # ci/** is where a branch goes for its own run before it lands.
    branches: [ "ci/**" ]
    paths: &paths [ "site/**", "docs/**", "tutorials/**", "src/dew/**", "examples/**", "CONTRIBUTING.md", "pyproject.toml", ".github/workflows/site.yml",
             ".github/actions/site/**" ]
  pull_request:
    branches: [ "main" ]
    paths: *paths
  workflow_dispatch:
    inputs:
      run_cells:
        description: "A deployed landing page whose live cells to run, such as https://preview.dewml.dev"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}${{ inputs.run_cells && '-cells' || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/ci/') }}

jobs:
  build:
    if: ${{ !inputs.run_cells }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: site
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the pages' last-updated dates come from git
    - uses: ./.github/actions/site
    - uses: astral-sh/setup-uv@v6
    - run: pnpm build
    - run: pnpm live:check
    - run: pnpm live:test
    - run: pnpm test  # Chrome, which ubuntu-latest has
    - run: node scripts/shots.mjs shots  # the landing page at 1440 and 390, dark and light
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: shots
        path: site/shots
        retention-days: 14
    - uses: actions/upload-artifact@v4
      if: github.event_name != 'pull_request'
      with:
        name: site
        path: site/dist
        retention-days: 7

  # Run on a deployed page: every landing cell that runs on the live pool, pressed as a visitor
  # would, each screenshotted once it finishes (scripts/run-cells.mjs).
  cells:
    if: ${{ inputs.run_cells }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: site
    steps:
    - uses: actions/checkout@v4
    - uses: ./.github/actions/site
    - run: node scripts/run-cells.mjs "$URL" cells
      env:
        URL: ${{ inputs.run_cells }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: cells
        path: site/cells
        retention-days: 14
