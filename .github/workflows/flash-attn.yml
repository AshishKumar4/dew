# Builds kernels/flash_attn's wheels, FlashAttention-2 for JAX, for each CUDA
# major on x86_64 and on aarch64 (the GH200's Grace), through cuda-wheels.yml,
# which kernels/cutlass's wheels share.
# The wheels are this run's artifacts. It runs for a release tag or by hand: a
# build takes about an hour, so a kernel change builds its wheel on a GPU node
# or the PC while its lane works, and a branch push builds none.
#
# A tag flash-attn-v<version> releases them: the build checks that the tag is
# the version kernels/flash_attn/pyproject.toml carries and that both wheels
# pass twine's checks, and one publish job per CUDA major uploads that major's
# two wheels to PyPI, the cu12 ones as dew-flash-attn-cu12 and the cu13 ones as
# dew-flash-attn-cu13. Trusted publishing: PyPI accepts this workflow's
# short-lived OIDC token, so the repository holds no PyPI secret. PyPI takes
# one pending publisher per (repository, workflow, environment), so each
# project names this repository, this workflow file and its own environment:
# `pypi` for cu12 and `pypi-cu13` for cu13. Only the publish jobs can mint the
# token, and they run no code from the repository.

name: FlashAttention wheels

on:
  push:
    tags: [ "flash-attn-v*" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    uses: ./.github/workflows/cuda-wheels.yml
    with:
      package: flash_attn
      tag: flash-attn

  publish:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/flash-attn-v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Each CUDA major's project and environment, one publish job a major.
        include:
        - cuda: "12.9.1"
          environment: pypi
          project: dew-flash-attn-cu12
        - cuda: "13.0.0"
          environment: pypi-cu13
          project: dew-flash-attn-cu13
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/p/${{ matrix.project }}
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        pattern: dew-flash-attn-cuda${{ matrix.cuda }}-*
        merge-multiple: true
        path: dist/
    - name: The wheels are this project's, one a machine
      # The CUDA major's build names its wheel after its project, which PyPI refuses under another's publisher.
      run: |
        ls dist/
        test "$(ls dist/ | wc -l)" = 2
        test "$(ls dist/ | grep -c "^$(echo '${{ matrix.project }}' | tr - _)-")" = 2
        ls dist/ | grep -q "_x86_64.whl$"
        ls dist/ | grep -q "_aarch64.whl$"
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
