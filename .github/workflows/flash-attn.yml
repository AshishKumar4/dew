# Builds kernels/flash_attn's wheels, FlashAttention-2 for JAX, for each CUDA
# major, on the CUDA toolkit's own glibc-2.28 image; no GPU is needed to build.
# The wheels are this run's artifacts.
#
# A tag flash-attn-v<version> releases them: the build checks that the tag is
# the version kernels/flash_attn/pyproject.toml carries and that both wheels
# pass twine's checks, and one publish job per CUDA major uploads that major's
# wheel to PyPI, the cu12 one as dew-flash-attn-cu12 and the cu13 one as
# dew-flash-attn-cu13. Trusted publishing: PyPI accepts this workflow's
# short-lived OIDC token, so the repository holds no PyPI secret. PyPI takes
# one pending publisher per (repository, workflow, environment), so each
# project names this repository, this workflow file and its own environment:
# `pypi` for cu12 and `pypi-cu13` for cu13. Only the publish jobs can mint the
# token, and they run no code from the repository.

name: FlashAttention wheels

on:
  push:
    branches: [ "main", "ci/**" ]
    # GitHub does not evaluate the paths below for a tag.
    tags: [ "flash-attn-v*" ]
    paths: [ "kernels/flash_attn/**", ".github/workflows/flash-attn.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      matrix:
        cuda: [ "12.9.1", "13.0.0" ]
    container: nvidia/cuda:${{ matrix.cuda }}-devel-rockylinux8
    defaults:
      run:
        shell: bash
    steps:
    - name: Install the build tools
      # The image's GCC 8 is older than nvcc's C++17 needs.
      run: |
        dnf install -y -q git python3.12 python3.12-pip gcc-toolset-12-gcc-c++
        python3.12 -m pip install --quiet cmake ninja twine
    - uses: actions/checkout@v4
    - name: The tag is the version the wheel carries
      if: startsWith(github.ref, 'refs/tags/flash-attn-v')
      run: |
        version=$(sed -n 's/^version = "\(.*\)"$/\1/p' kernels/flash_attn/pyproject.toml)
        test "$GITHUB_REF_NAME" = "flash-attn-v$version" || {
          echo "the tag is $GITHUB_REF_NAME and kernels/flash_attn carries $version"; exit 1; }
    - name: Build
      env:
        PYTHON: python3.12
        JOBS: "4"
      run: |
        source /opt/rh/gcc-toolset-12/enable
        sh kernels/flash_attn/build.sh
    - name: Check the wheel as PyPI will
      run: python3.12 -m twine check --strict kernels/flash_attn/dist/*.whl
    - uses: actions/upload-artifact@v4
      with:
        name: dew-flash-attn-cuda${{ matrix.cuda }}
        path: kernels/flash_attn/dist/*.whl

  publish:
    needs: wheel
    if: startsWith(github.ref, 'refs/tags/flash-attn-v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
        - cuda: "12.9.1"
          environment: pypi
          project: dew-flash-attn-cu12
        - cuda: "13.0.0"
          environment: pypi-cu13
          project: dew-flash-attn-cu13
    environment:
      name: ${{ matrix.environment }}
      url: https://pypi.org/p/${{ matrix.project }}
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dew-flash-attn-cuda${{ matrix.cuda }}
        path: dist/
    - name: The wheel is this project's
      # The CUDA major's build names its wheel after its project, which PyPI refuses under another's publisher.
      run: |
        ls dist/
        test "$(ls dist/ | wc -l)" = 1
        ls dist/ | grep -q "^$(echo '${{ matrix.project }}' | tr - _)-"
    - name: Publish
      uses: pypa/gh-action-pypi-publish@release/v1
