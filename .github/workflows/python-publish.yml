name: Publish to PyPI

# Releases only. Pushes to main must not ship untested code to PyPI.
#
# A release publishes only what passed on its own commit: the whole CI
# (lint, package and the suite on armada) runs here on the release's commit,
# and its package job builds the wheel and sdist, installs them into an empty
# environment, compiles them, runs their `dew` entry point and trains, then
# hands that same artifact to the publish job, which uploads it without a rebuild.
#
# Trusted publishing: PyPI accepts this workflow's short-lived OIDC token, so
# the repository holds no PyPI secret. PyPI's project `dewml` names this
# repository, this workflow file and the `pypi` environment as its publisher
# (for the first release, a pending publisher on the account that will own
# the project). Only the publish job can mint the token, and it runs no code
# from the repository.
on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # CI's proven job may read the runs of a push, and main's the land queue's status; a release's call runs
      # it all.
      actions: read
      statuses: read
    # The test job reaches armada with ARMADA_URL and ARMADA_TOKEN.
    secrets: inherit

  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The release's tag is the version the package carries
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/dew/__init__.py)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "the release is tagged $GITHUB_REF_NAME and dew.__version__ is $version"; exit 1; }

  publish:
    needs: [ci, tag]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dewml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
