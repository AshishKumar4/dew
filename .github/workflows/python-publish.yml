name: Publish a release

# Releases only. Pushes to main ship nothing.
#
# A release publishes only what passed on its own commit: the whole CI
# (lint, package and the suite on armada) runs here on the release's commit,
# and its package job builds the wheel and sdist, installs them into an empty
# environment, compiles them, runs their `dew` entry point and trains, then
# hands that same artifact to the publish job, which attaches it to the release
# without a rebuild.
#
# Dew's package index, https://pypi.dewml.dev/simple, takes the release from
# those assets (AshishKumar4/jax's publish-package workflow, run with this
# release's tag): dewml installs from there beside Dew's JAX build, which PyPI
# does not hold. PyPI's dewml is a pointer that installs nothing and names the
# index (0.1.1), so no release goes to PyPI.
on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # CI's proven job may read the runs of a push, and main's the land queue's status; a release's call runs
      # it all.
      actions: read
      statuses: read
    # The test job reaches armada with ARMADA_URL and ARMADA_TOKEN.
    secrets: inherit

  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: The release's tag is the version the package carries
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/dew/_version.py)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "the release is tagged $GITHUB_REF_NAME and dew.__version__ is $version"; exit 1; }

  publish:
    needs: [ci, tag]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Attach the tested sdist and wheel to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY"
