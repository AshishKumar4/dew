name: Publish to PyPI

# Releases only. Pushes to main must not ship untested code to PyPI.
#
# A release publishes only what passed on its own commit: the whole CI
# (lint, package and the suite on armada) runs here on the release's commit,
# the wheel and sdist are built from it, and that same artifact is installed
# into an empty environment, compiled, run through its `dew` entry point and
# trained on before the publish job, which needs all three, uploads it.
#
# Trusted publishing: PyPI accepts this workflow's short-lived OIDC token, so
# the repository holds no PyPI secret. PyPI's project `dewml` names this
# repository, this workflow file and the `pypi` environment as its publisher
# (for the first release, a pending publisher on the account that will own
# the project). Only the publish job can mint the token, and it runs no code
# from the repository.
on:
  release:
    types: [published]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      # CI's proven job may read the runs of a push; a release's call runs it all.
      actions: read
    # The test job reaches armada with ARMADA_URL and ARMADA_TOKEN.
    secrets: inherit

  build:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The release's tag is the version the package carries
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/dew/__init__.py)
          test "$GITHUB_REF_NAME" = "v$version" || {
            echo "the release is tagged $GITHUB_REF_NAME and dew.__version__ is $version"; exit 1; }
      - name: Build and check the sdist and wheel
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check --strict dist/*
          python tools/check_distribution.py dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # The artifact the publish job uploads, not a rebuild of it.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Install the wheel into an empty environment, compile it, run `dew --help` and train
        run: python tools/smoke_wheel.py dist/*.whl

  publish:
    needs: [ci, build, smoke]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/dewml
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
