# Installs dew-ml, checks for syntax errors and undefined names, type checks
# src/dew, runs the CPU test lane. For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[test,av,tfds,metrics,plots,inference-clients]"
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Type check the Python 3.12 compatibility floor
      if: matrix.python-version == '3.12'
      run: |
        # Check minimum syntax against its matching standard library.
        # Both interpreters run the runtime tests below.
        pip install uv
        uvx pyright@1.1.406 --pythonpath "$(which python)" src/dew
    - name: Test with pytest
      run: |
        /usr/bin/time -v env JAX_PLATFORMS=cpu PYTHONFAULTHANDLER=1 pytest -m "not network" -vv --capture=tee-sys -ra --junitxml=pytest-report.xml
    - name: Annotate failures
      if: always()
      run: |
        python - <<'EOF'
        import xml.etree.ElementTree as ET
        from pathlib import Path
        def escape(value):
            return value.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

        if not Path("pytest-report.xml").is_file():
            print("::notice::No pytest report was produced; inspect earlier CI steps.")
            raise SystemExit(0)
        root = ET.parse("pytest-report.xml").getroot()
        for case in root.iter("testcase"):
            for kind in ("failure", "error"):
                node = case.find(kind)
                if node is not None:
                    title = escape(f"{case.get('classname')}.{case.get('name')}")
                    title = title.replace(":", "%3A").replace(",", "%2C")
                    detail = escape(node.text or node.get("message") or "Test failed")
                    print(f"::error title={title}::{detail}")
        EOF
    - name: Upload the test report
      if: always() && hashFiles('pytest-report.xml') != ''
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report-${{ matrix.python-version }}
        path: pytest-report.xml
