# Installs dewml, checks for syntax errors and undefined names, lints and type
# checks src/dew, and runs the CPU test lane on armada. For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # ci/** is where a branch goes for its own run before it lands.
    branches: [ "main", "ci/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  # Daily, main's every test file runs, the test cache aside (tools/armada/ci.py), so nothing it
  # skipped can hide.
  schedule:
    - cron: "17 9 * * *"
  # The release workflow runs all of this on the release's own commit and
  # publishes only if every job passes.
  workflow_call:

permissions:
  contents: read

# A newer push to the same ref makes the older run's verdict moot.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The armada runner every armada job uses.
  ARMADA: github:AshishKumar4/armada#d3ddca1ac25e100e47fe736f56f18c1b307f4d12

jobs:
  # A commit this workflow passed on another push, as one proved on
  # ci/integration before main takes it, is not proved again: lint and
  # package skip, and the test job finds armada's verdict. A pull request, a
  # dispatch and the release's call run everything.
  proven:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
    - uses: actions/checkout@v4
      if: github.event_name == 'push'
    - id: find
      if: github.event_name == 'push'
      uses: ./.github/actions/proven
      with:
        workflow: ci.yml

  # Lint and the site's checks, and the type check beside them: each installs
  # dewml as tools/armada/install.sh does, with uv, from uv's cache.
  lint:
    needs: proven
    if: needs.proven.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: locks/cpu.txt
    - name: Install dependencies
      run: |
        sh tools/install_environment.sh cpu --system
    - name: Every cheap gate (tools/check.sh), all failures reported
      run: sh tools/check.sh
    - name: Upload the complexity distribution
      uses: actions/upload-artifact@v4
      with:
        name: complexity
        path: complexity.json
    - uses: pnpm/action-setup@v4
      with:
        package_json_file: site/package.json
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: pnpm
        cache-dependency-path: site/pnpm-lock.yaml
    - name: Install site dependencies
      run: pnpm --dir site install --frozen-lockfile
    - name: Check site content
      run: |
        node site/scripts/sync-docs.mjs --check
        node site/scripts/render-notebooks.mjs --check
        JAX_PLATFORMS=cpu python site/scripts/gen_models.py --check
        python site/scripts/gen_examples.py --check

  # What PyPI receives, installed the way a user installs it: the sdist and
  # wheel build, pass twine, and name no requirement by URL, which PyPI
  # refuses and twine passes; the wheel installs from PyPI alone into an
  # empty environment and runs; and the accelerator extras resolve.
  package:
    needs: proven
    if: needs.proven.outputs.run == ''
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version-file: .python-version
    - name: Build and check the sdist and wheel
      run: |
        python -m pip install --upgrade pip build twine uv
        python -m build
        python -m twine check --strict dist/*
        python tools/check_distribution.py dist/*
    - name: Install the wheel into an empty environment, compile it, run `dew --help` and train
      run: python tools/smoke_wheel.py dist/*.whl
    - name: Install the wheel from PyPI into an empty environment
      run: |
        python -m venv "$RUNNER_TEMP/clean"
        "$RUNNER_TEMP/clean/bin/pip" install --quiet --index-url https://pypi.org/simple dist/*.whl
    - name: Run it
      working-directory: ${{ runner.temp }}
      run: |
        "$RUNNER_TEMP/clean/bin/python" - <<'EOF'
        import importlib.metadata

        import jax
        import jax.numpy as jnp

        import dew
        from dew.nn.backbones import CausalTransformer
        from dew.training.runtime import _pool_keys_alike

        assert "site-packages" in dew.__file__, dew.__file__
        print("dewml", importlib.metadata.version("dewml"), "jax", jax.__version__,
              "flax", importlib.metadata.version("flax"))
        # PyPI's jax 0.11.2 lacks jax-ml/jax#40940, and Dew sees that it does.
        assert not _pool_keys_alike()
        import flax.nnx  # noqa: E402,F401  imports on jax 0.11.2 from flax 0.12.10 on
        model = CausalTransformer(vocab_size=64, emb_features=32, num_layers=2,
                                  num_heads=4, num_kv_heads=2, mlp_features=64, max_seq_len=16)
        tokens = jnp.arange(16, dtype=jnp.int32).reshape(2, 8)
        logits = jax.jit(model.apply)(model.init(jax.random.key(0), tokens), tokens)
        assert logits.shape == (2, 8, 64) and bool(jnp.all(jnp.isfinite(logits)))
        EOF
    - name: PyPI's jax still keys a pool's processes apart (jax-ml/jax#40940)
      # The repro is expected to fail here (xfail, strict): once it passes, a
      # release carries the fix, and the patched jax and its refusal can go.
      run: |
        "$RUNNER_TEMP/clean/bin/pip" install --quiet pytest
        DEW_UPSTREAM_JAX=1 "$RUNNER_TEMP/clean/bin/python" -m pytest -q -rxX \
          tests/test_distribution.py::test_a_pools_second_run_loads_what_its_first_compiled
    - name: Resolve the accelerator extras
      run: |
        for extras in cuda12,quantization,profile cuda13,quantization,profile tpu,quantization,profile; do
          echo "dewml[$extras] @ file://$(realpath dist/*.whl)" \
            | uv pip compile - --python-version "$(tr -d '\n' < .python-version)" --python-platform x86_64-manylinux_2_31 --quiet > /dev/null
        done
    - name: Install the jax for GPU pools as docs/installation.md says
      run: |
        uv pip install --python "$RUNNER_TEMP/clean/bin/python" --quiet jax \
          -c "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/constraints.txt"
        cd "$RUNNER_TEMP"
        "$RUNNER_TEMP/clean/bin/python" -c "from dew.training.runtime import _pool_keys_alike; assert _pool_keys_alike()"

  test:
    needs: proven
    runs-on: ubuntu-latest
    # The suite runs on armada (.armada.json, tools/armada/ci.py): both
    # Pythons as tasks of about five minutes each on Dew's own armada
    # deployment, on at most 84 containers: with the gangs' 12, a run holds
    # 96 of the deployment's 108 and leaves the rest to the lanes' own jobs.
    # A straggler at the end runs again (task.speculative). Tasks share XLA's
    # compilations through the dew-xla-cache Worker (tests/remote_cache.py).
    # Its URL and token are the ARMADA_URL and ARMADA_TOKEN secrets.
    # This job sends the commit, waits, and prints each red row's output; a
    # failed test, a test skipped on a missing import and a file left
    # unreported each fail it. A commit armada already graded green, as one
    # proved on ci/integration before main takes it, is not run again.
    # Beside the suite, tests/test_multihost.py runs the multi-process pools
    # across four containers of an armada gang, one host each, which reach
    # each other through armada's relay: collectives, the coordinator and
    # local checkpoints cross separate machines, as no one-host test does.
    # Its gangs run side by side, one a model's layout parity and one the
    # rest (each about 5 min), as `ci.py gangs` reads them from the test's
    # MODELS, so every case runs in one. A commit proven on another push is not run
    # again. One run's armada jobs at a time (`armada`, queued in order): two
    # runs' suites fill the deployment's fleet, and the gangs, which need
    # four containers at once, then wait out their deadline (armada#49).
    concurrency:
      group: armada
      cancel-in-progress: false
      queue: max
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        # armada sends what the commit adds to its environment's commit,
        # which it finds in the history.
        fetch-depth: 0
    - uses: oven-sh/setup-bun@v2
    - name: Run the suite and the multi-host gangs on armada
      env:
        ARMADA_URL: ${{ secrets.ARMADA_URL }}
        ARMADA_TOKEN: ${{ secrets.ARMADA_TOKEN }}
        DEW_TEST_CACHE: ${{ github.event_name == 'schedule' && 'off' || 'on' }}
        PROVEN: ${{ needs.proven.outputs.run }}
      run: |
        armada="bunx --bun $ARMADA"
        # Each client runs in a session of its own, so the interrupt a cancelled run sends this shell
        # reaches it and it cancels its armada job; the shell waits on them, where a trap runs.
        trap 'for group in ${gangs:-} ${suite:-}; do kill -INT -- "-$group" 2>/dev/null || true; done' INT TERM
        if [ -z "$PROVEN" ]; then
          # A gang member lost before the start fails it within 300 s (armada#22).
          items=$(python3 tools/armada/ci.py gangs)
          echo "$items" | setsid $armada map --commit=${{ github.sha }} --items=- --size=medium \
            --pool="$(echo "$items" | python3 -c 'import json, sys; print(sum(gang["gang"] for gang in json.load(sys.stdin)))')" \
            --deadline=1800 --gang-start-timeout=300 \
            --label="${{ github.ref_name }}" -- ".venv-$(tr -d '\n' < .python-version)/bin/python" -m pytest -q \
            -m "not network" -k "{select}" -rfE --tb=short --basetemp=/tmp/dew-gang tests/test_multihost.py \
            > "$RUNNER_TEMP/gangs.log" 2>&1 &
          gangs=$!
        fi
        # Its own deadline sits below this job's 60 minutes, so a hang is armada's named error, and
        # above what every file takes on 84 containers when no row is cached (a change to a module
        # most tests import, and the daily run, which proves the commit again with every file).
        if [ "$DEW_TEST_CACHE" = off ] || ! $armada verdict ${{ github.sha }}; then
          setsid $armada run ${{ github.sha }} --deadline=2700 --label="${{ github.ref_name }}" \
            > >(tee "$RUNNER_TEMP/suite.log") 2> >(tee "$RUNNER_TEMP/suite.err" >&2) &
          suite=$!
        fi
        failed=0
        if [ -n "${suite:-}" ]; then wait "$suite" || failed=1; fi
        if [ -n "${gangs:-}" ]; then
          wait "$gangs" || failed=1
          echo "--- the multi-host gangs"
          cat "$RUNNER_TEMP/gangs.log"
        fi
        exit $failed
    - name: Cancel the armada jobs of a cancelled run
      # A client killed before it cancelled leaves its job running to its deadline, on the fleet the
      # next run needs: each job the clients named is cancelled (armada's POST /jobs/<id>/cancel, at
      # the wire version of the client pinned above).
      if: cancelled()
      env:
        ARMADA_URL: ${{ secrets.ARMADA_URL }}
        ARMADA_TOKEN: ${{ secrets.ARMADA_TOKEN }}
      run: |
        for id in $(cat "$RUNNER_TEMP"/gangs.log "$RUNNER_TEMP"/suite.log "$RUNNER_TEMP"/suite.err 2>/dev/null \
                    | grep -oE '\bjob [0-9]{14}-[0-9a-f]{8}' | cut -d' ' -f2 | sort -u); do
          curl -sS -X POST "${ARMADA_URL%/}/jobs/$id/cancel" -H "authorization: Bearer $ARMADA_TOKEN" \
            -H "armada-protocol: 10" || true
          echo " cancelled $id"
        done
