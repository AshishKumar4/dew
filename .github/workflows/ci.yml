# Installs dew-ml, checks for syntax errors and undefined names, runs the
# CPU test lane. For more information see:
# https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8
        pip install -e .[test]
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Test with pytest
      run: |
        JAX_PLATFORMS=cpu pytest -m "not network" -q -ra --junitxml=pytest-report.xml
    - name: Annotate failures
      if: always()
      run: |
        python - <<'EOF'
        import xml.etree.ElementTree as ET
        root = ET.parse("pytest-report.xml").getroot()
        for case in root.iter("testcase"):
            for kind in ("failure", "error"):
                node = case.find(kind)
                if node is not None:
                    detail = " | ".join(line.strip() for line in (node.text or "").strip().splitlines()[-3:])
                    print(f"::error title={case.get('classname')}.{case.get('name')}::{(node.get('message') or '')[:400]} || {detail[:600]}")
        EOF
    - name: Upload the test report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: pytest-report
        path: pytest-report.xml
