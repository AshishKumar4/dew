# Runs every tutorial notebook top to bottom at smoke size on a CPU, so a
# change to the library cannot break a notebook without failing a check.
# Each notebook's Settings cell holds its own smoke sizes (DEW_TUTORIAL_SMOKE).
# Then it reports, as warnings that do not fail the run, each notebook whose
# recorded outputs are older than a change to the Dew modules it imports. A
# daily full run on the shared Colab runtime refreshes the outputs.

name: Tutorials

on:
  push:
    # ci/** is the branch run a head gets before it lands, so a notebook a
    # change breaks fails there rather than after the merge.
    branches: [ "main", "ci/**" ]
    paths: [ "src/dew/**", "tutorials/**", "pyproject.toml", "tools/run_tutorials.py", "tools/check_tutorial_outputs.py", ".github/workflows/tutorials.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "src/dew/**", "tutorials/**", "pyproject.toml", "tools/run_tutorials.py", "tools/check_tutorial_outputs.py", ".github/workflows/tutorials.yml" ]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Two runners of about four minutes of notebooks each (01 153 s, 03
        # 72 s; 02 49, 04 45, 05 18, 06 34, 07 18, 08 102 s in run
        # 37538968124). 04 reads the checkpoint 02 writes, so they share one.
        notebooks: ["01 03", "02 04 05 06 07 08"]
    name: smoke (${{ matrix.notebooks }})
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the outputs check reads the history since each notebook's recorded commit
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install Dew and the notebooks' dependencies
      run: |
        python -m pip install --upgrade pip
        pip install torch --index-url https://download.pytorch.org/whl/cpu
        pip install -e ".[streaming,interop,plots]" nbclient nbformat ipykernel
    - name: Cache the datasets and checkpoints the notebooks download
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: tutorials-hf-v1
    - name: Run the tutorials
      run: python tools/run_tutorials.py ${{ matrix.notebooks }} --workdir "$RUNNER_TEMP/tutorials" --imports "$RUNNER_TEMP/imports.json"
    - name: Report outputs older than the code they ran
      if: success() || failure()
      run: python tools/check_tutorial_outputs.py "$RUNNER_TEMP/imports.json" --report ${{ matrix.notebooks }}
