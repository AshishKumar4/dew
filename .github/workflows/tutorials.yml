# Runs every tutorial notebook top to bottom at smoke size on a CPU, so a
# change to the library cannot break a notebook without failing a check.
# Each notebook's Settings cell holds its own smoke sizes (DEW_TUTORIAL_SMOKE).
# Then it reports, as warnings that do not fail the run, each notebook whose
# recorded outputs are older than a change to the Dew modules it imports. A
# daily full run on the shared Colab runtime refreshes the outputs.

name: Tutorials

on:
  push:
    # ci/** is the branch run a head gets before it lands, so a notebook a
    # change breaks fails there rather than after the merge.
    branches: [ "main", "ci/**" ]
    paths: [ "src/dew/**", "tutorials/**", "pyproject.toml", "tools/run_tutorials.py", "tools/check_tutorial_outputs.py", ".github/workflows/tutorials.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "src/dew/**", "tutorials/**", "pyproject.toml", "tools/run_tutorials.py", "tools/check_tutorial_outputs.py", ".github/workflows/tutorials.yml" ]
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A commit this workflow passed on another push, as one proved on
  # ci/integration before main takes it, is not run again. The daily run, a
  # pull request and a dispatch run every notebook.
  proven:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
    - id: find
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A pull request's run tested a merge, not this commit.
        run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tutorials.yml/runs?head_sha=$GITHUB_SHA&status=success" \
          --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty')
        echo "run=$run" >> "$GITHUB_OUTPUT"
        if [ -n "$run" ]; then echo "passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"; fi

  smoke:
    needs: proven
    if: needs.proven.outputs.run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Three runners of about two and a half minutes of notebooks each (01
        # 83 s, 03 40; 02 55, 04 47, 05 20, 07 18; 06 35, 08 107 in run
        # 37786757641). 04 reads the checkpoint 02 writes, so they share one.
        notebooks: ["01 03", "02 04 05 07", "06 08"]
    name: smoke (${{ matrix.notebooks }})
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the outputs check reads the history since each notebook's recorded commit
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: pyproject.toml
    - name: Install Dew and the notebooks' dependencies
      run: |
        uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu
        uv pip install --system -e ".[streaming,interop,plots]" nbclient nbformat ipykernel
    - name: Cache the datasets and checkpoints the notebooks download
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        key: tutorials-hf-v1
    - name: Run the tutorials
      run: python tools/run_tutorials.py ${{ matrix.notebooks }} --workdir "$RUNNER_TEMP/tutorials" --imports "$RUNNER_TEMP/imports.json"
    - name: Report outputs older than the code they ran
      if: success() || failure()
      run: python tools/check_tutorial_outputs.py "$RUNNER_TEMP/imports.json" --report ${{ matrix.notebooks }}
