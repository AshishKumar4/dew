# Runs every tutorial notebook top to bottom at smoke size on a CPU when a
# notebook or the tutorial tooling changes, and on request. Library changes do
# not trigger it: per-batch notebook runs cost more than they caught. Each
# notebook's Settings cell holds its own smoke sizes (DEW_TUTORIAL_SMOKE).
# Then it reports, as warnings that do not fail the run, each notebook whose
# recorded outputs are older than a change to the Dew modules it imports.

name: Tutorials

on:
  push:
    branches: [ "main", "ci/**" ]
    paths: [ "tutorials/**", "tools/run_tutorials.py", "tools/check_tutorial_outputs.py", ".github/workflows/tutorials.yml" ]
  pull_request:
    branches: [ "main" ]
    paths: [ "tutorials/**", "tools/run_tutorials.py", "tools/check_tutorial_outputs.py", ".github/workflows/tutorials.yml" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # A commit this workflow passed on another push, as one proved on
  # ci/integration before main takes it, is not run again. A pull request
  # and a dispatch run every notebook.
  proven:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run: ${{ steps.find.outputs.run }}
    steps:
    - id: find
      if: github.event_name == 'push'
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # A pull request's run tested a merge, not this commit.
        run=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/tutorials.yml/runs?head_sha=$GITHUB_SHA&status=success" \
          --jq '[.workflow_runs[] | select(.event != "pull_request")][0].id // empty')
        echo "run=$run" >> "$GITHUB_OUTPUT"
        if [ -n "$run" ]; then echo "passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run"; fi

  smoke:
    needs: proven
    if: needs.proven.outputs.run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Three runners of about two and a half minutes of notebooks each (01
        # 83 s, 03 40; 02 55, 04 47, 05 20, 07 18; 06 35, 08 107 in run
        # 37786757641; 11 about 40 s on armada). 04 reads the checkpoint 02
        # writes, so they share one.
        notebooks: ["01 03 11", "02 04 05 07", "06 08", "09 10"]
    name: smoke (${{ matrix.notebooks }})
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # the outputs check reads the history since each notebook's recorded commit
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@v6
      with:
        enable-cache: true
        cache-dependency-glob: locks/cpu.txt
    - name: Install Dew and the notebooks' dependencies
      run: |
        sh tools/install_environment.sh cpu --system
    - name: Cache the datasets and checkpoints the notebooks download
      uses: actions/cache@v4
      with:
        path: ~/.cache/huggingface
        # One cache per job, since each job downloads only its own notebooks' files; a shared key
        # kept whichever job saved first, and the others fetched from the Hub on every run. A
        # notebook edit saves a new cache on top of the last one.
        key: tutorials-hf-${{ matrix.notebooks }}-${{ hashFiles('tutorials/*.ipynb') }}
        restore-keys: tutorials-hf-${{ matrix.notebooks }}-
    - name: Run the tutorials
      run: python tools/run_tutorials.py ${{ matrix.notebooks }} --workdir "$RUNNER_TEMP/tutorials" --imports "$RUNNER_TEMP/imports.json"
    - name: Report outputs older than the code they ran
      if: success() || failure()
      run: python tools/check_tutorial_outputs.py "$RUNNER_TEMP/imports.json" --report ${{ matrix.notebooks }}
