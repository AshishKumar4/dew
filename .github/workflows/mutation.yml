name: Mutation tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: Source module to mutate (tools/mutation.py --help lists choices)
        required: true
        default: process
        type: string
      file:
        description: One Python source file inside the selected module (blank selects all)
        required: false
        type: string
  # One module a night; ordinary pushes leave the runners to the regular gates.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.module }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - name: Choose the night's module
        id: plan
        env:
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          module=()
          if [[ -n "$REQUESTED_MODULE" ]]; then module=("$REQUESTED_MODULE"); fi
          plan=$(python tools/mutation.py --plan "${module[@]}")
          echo "plan=$plan" >> "$GITHUB_OUTPUT"

  mutation:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.plan).matrix }}
    env:
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      MODULE: ${{ fromJSON(needs.plan.outputs.plan).module }}
      SOURCE_FILE: ${{ inputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: locks/cpu.txt
      - name: Install dependencies
        run: |
          sh tools/install_environment.sh cpu --system
      - name: Run mutation tests
        run: |
          file=()
          if [[ -n "$SOURCE_FILE" ]]; then file=(--file "$SOURCE_FILE"); fi
          python tools/mutation.py "$MODULE" "${file[@]}" --shard ${{ matrix.shard }} --shards ${{ fromJSON(needs.plan.outputs.plan).shards }} \
            --output "mutation-${{ matrix.shard }}" --seconds 9600
      - name: Upload mutations and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutations-${{ matrix.shard }}
          path: mutation-${{ matrix.shard }}/
          if-no-files-found: error

  summary:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: .python-version
      - uses: actions/download-artifact@v4
        with:
          pattern: mutations-*
          path: mutation-reports
      - name: Report the module score
        run: python tools/mutation.py --summarize mutation-reports >> "$GITHUB_STEP_SUMMARY"
