name: Mutation tests

on:
  workflow_dispatch:
    inputs:
      module:
        description: Source module to mutate
        required: true
        default: process
        type: choice
        options: [transaction, checkpoints, process, schedules, attention, sources]
      file:
        description: One Python source file inside the selected module (blank selects all)
        required: false
        type: string
  # One module a night; ordinary pushes leave the runners to the regular gates.
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.ref }}-${{ inputs.module }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      module: ${{ steps.module.outputs.module }}
    steps:
      - name: Choose the night's module
        id: module
        env:
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          python - <<'PY'
          import datetime
          import os

          modules = ("process", "transaction", "checkpoints")
          module = os.environ["REQUESTED_MODULE"] or modules[datetime.datetime.now(datetime.UTC).weekday() % 3]
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"module={module}\n")
          PY

  mutation:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    env:
      JAX_PLATFORMS: cpu
      PYTHONDONTWRITEBYTECODE: "1"
      OPENBLAS_NUM_THREADS: "1"
      OMP_NUM_THREADS: "2"
      MODULE: ${{ needs.plan.outputs.module }}
      SOURCE_FILE: ${{ inputs.file }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[test,mutation,av,tfds]" -c constraints.txt
      - name: Run mutation tests
        run: |
          file=()
          if [[ -n "$SOURCE_FILE" ]]; then file=(--file "$SOURCE_FILE"); fi
          python tools/mutation.py "$MODULE" "${file[@]}" --shard ${{ matrix.shard }} --shards 8 \
            --output "mutation-${{ matrix.shard }}" --seconds 9600
      - name: Upload mutations and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutations-${{ matrix.shard }}
          path: mutation-${{ matrix.shard }}/
          if-no-files-found: error

  summary:
    needs: mutation
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: mutations-*
          path: mutation-reports
      - name: Report the module score
        run: python tools/mutation.py --summarize mutation-reports >> "$GITHUB_STEP_SUMMARY"
