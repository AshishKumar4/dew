<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 760 449" width="760" height="449" role="img" aria-label="One training run through Dew. A script calls Trainer(objective, optax, key).fit(data), or dew train builds the same Trainer from a RunConfig. Trainer.fit compiles the step: jax.jit traces it, it is lowered to StableHLO with kernels as custom calls, and XLA compiles it. Kernels come from Dew&#x27;s templates, vendor libraries or XLA, and run in one executable per step."><title>One training run through Dew. A script calls Trainer(objective, optax, key).fit(data), or dew train builds the same Trainer from a RunConfig. Trainer.fit compiles the step: jax.jit traces it, it is lowered to StableHLO with kernels as custom calls, and XLA compiles it. Kernels come from Dew&#x27;s templates, vendor libraries or XLA, and run in one executable per step.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="110" y="16" width="340" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="122" y="39" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer(…).fit(data)</text><text x="122" y="61" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">a script or notebook</text><rect x="462" y="16" width="282" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="474" y="39" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">or: dew train run.json</text><text x="474" y="61" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">RunConfig builds the same Trainer</text><rect x="110" y="100" width="634" height="81" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="122" y="123" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer.fit</text><text x="122" y="145" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">compiles a step per batch shape,</text><text x="122" y="164" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">runs it every micro-batch</text><rect x="110" y="203" width="206" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="122" y="226" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">jax.jit</text><text x="122" y="248" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">traces the step</text><rect x="324" y="203" width="206" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="336" y="226" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">lower</text><text x="336" y="248" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">StableHLO</text><rect x="538" y="203" width="206" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="550" y="226" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">XLA compile</text><text x="550" y="248" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">fuses, runs ptxas</text><rect x="110" y="287" width="220" height="62" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="122" y="310" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Dew&#x27;s templates</text><text x="122" y="332" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">Mosaic GPU, Triton, TPU</text><rect x="338" y="287" width="200" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="350" y="310" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">vendor kernels</text><text x="350" y="332" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">FlashAttention, cuDNN</text><rect x="546" y="287" width="198" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="558" y="310" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">XLA</text><text x="558" y="332" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">fusions, cuBLAS</text><rect x="110" y="371" width="634" height="62" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="122" y="394" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">one executable per step</text><text x="122" y="416" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">its kernels run in order</text><text x="16" y="49" font-size="11" font-weight="600" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">YOUR CODE</text><text x="16" y="142" font-size="11" font-weight="600" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">TRAINER</text><text x="16" y="236" font-size="11" font-weight="600" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">COMPILE</text><text x="16" y="320" font-size="11" font-weight="600" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">KERNELS</text><text x="16" y="404" font-size="11" font-weight="600" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">GPU</text><g><line x1="427" y1="78" x2="427" y2="98" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M427,98 L423.5,91 L430.5,91 z" style="fill:var(--fig-muted)"/></g><g><line x1="427" y1="181" x2="427" y2="201" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M427,201 L423.5,194 L430.5,194 z" style="fill:var(--fig-muted)"/></g><g><line x1="316" y1="234" x2="322" y2="234" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M322,234 L315,237.5 L315,230.5 z" style="fill:var(--fig-muted)"/></g><g><line x1="530" y1="234" x2="536" y2="234" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M536,234 L529,237.5 L529,230.5 z" style="fill:var(--fig-muted)"/></g><g><line x1="427" y1="265" x2="427" y2="285" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M427,285 L423.5,278 L430.5,278 z" style="fill:var(--fig-muted)"/></g><g><line x1="427" y1="349" x2="427" y2="369" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M427,369 L423.5,362 L430.5,362 z" style="fill:var(--fig-muted)"/></g></svg>
