ention forward call: attend, then</text><text x="12" y="499" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">MosaicForward.derived, bundles.of, the launch,</text><text x="12" y="521" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">and each consumer&#x27;s walk.</text></svg>
