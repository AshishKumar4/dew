<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 360 392" width="360" height="392" role="img" aria-label="One step of DreamerV3&#x27;s latent. The deterministic state h, 512 numbers from a block GRU, carries the past. The stochastic part z is 32 categorical draws: from the posterior when the step&#x27;s observation is there to read, and from the prior, h alone, when the model imagines. Training pulls the prior toward the posterior. The two together feed heads that rebuild the observation and predict reward and continuation."><title>One step of DreamerV3&#x27;s latent. The deterministic state h, 512 numbers from a block GRU, carries the past. The stochastic part z is 32 categorical draws: from the posterior when the step&#x27;s observation is there to read, and from the prior, h alone, when the model imagines. Training pulls the prior toward the posterior. The two together feed heads that rebuild the observation and predict reward and continuation.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--