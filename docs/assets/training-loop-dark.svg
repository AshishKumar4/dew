<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker></defs>
  <rect x="24" y="24" width="208" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="42" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">next batch</text>
  <text x="42" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">from the prefetch iterator</text>
  <line x1="236" y1="62.0" x2="258" y2="62.0" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="262" y="24" width="208" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="280" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">shard</text>
  <text x="280" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">onto the (data, fsdp) mesh</text>
  <line x1="474" y1="62.0" x2="496" y2="62.0" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="500" y="24" width="208" height="76" rx="8" fill="#0f2a27" stroke="#2fb8a8" stroke-width="1.25"/>
  <text x="518" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">compiled step</text>
  <text x="518" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">loss, grad, optimizer, EMA</text>
  <line x1="712" y1="62.0" x2="734" y2="62.0" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <rect x="738" y="24" width="208" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="756" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">log</text>
  <text x="756" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">loss, aux metrics, throughput</text>
  <path d="M 946 62.0 L 980 62.0 L 980 126 L 128.0 126 L 128.0 104" fill="none" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="140.0" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">every step</text>
  <rect x="24" y="170" width="356" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="42" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">validation</text>
  <text x="42" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">objective.make_validation_step, then the metrics</text>
  <rect x="410" y="170" width="356" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="428" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">checkpoint</text>
  <text x="428" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">state, EMA, optimizer, rng, iterator position</text>
  <rect x="796" y="170" width="380" height="76" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="814" y="200" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">best tracking</text>
  <text x="814" y="222" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">lowest validation loss kept alongside the latest</text>
  <line x1="200" y1="140" x2="200" y2="168" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 5"/>
  <line x1="588" y1="140" x2="588" y2="168" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)" stroke-dasharray="5 5"/>
  <text x="214" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">epoch end</text>
  <text x="602" y="160" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">epoch end, or every checkpoint_every_steps</text>
  <line x1="766" y1="208.0" x2="794" y2="208.0" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="24" y="276" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">The compiled step is one XLA program: the loss from the objective, the gradient, the optimizer update and the EMA update. It is compiled once per run.</text>
</svg>
