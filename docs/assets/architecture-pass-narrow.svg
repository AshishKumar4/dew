<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 360 615" width="360" height="615" role="img" aria-label="The compile-time algebra pass, top to bottom: the traced jaxpr, its terms, windows, saturation, extraction and splicing, then the outer jit lowers the result."><title>The compile-time algebra pass, top to bottom: the traced jaxpr, its terms, windows, saturation, extraction and splicing, then the outer jit lowers the result.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="12" y="12" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="35" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">traced jaxpr</text><text x="24" y="57" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">the whole step, backward included</text><g><line x1="180" y1="67" x2="180" y2="83" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,83 L176.5,76 L183.5,76 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="85" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="108" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">terms</text><text x="24" y="130" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">language equations become terms;</text><text x="24" y="149" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">the rest stay opaque</text><g><line x1="180" y1="159" x2="180" y2="175" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,175 L176.5,168 L183.5,168 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="177" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="200" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">windows</text><text x="24" y="222" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">each cheapenable head with two</text><text x="24" y="241" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">producer levels; 64 equations</text><g><line x1="180" y1="251" x2="180" y2="267" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,267 L176.5,260 L183.5,260 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="269" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="292" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">saturate</text><text x="24" y="314" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">facts, identities, linear,</text><text x="24" y="333" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">round by round, in a budget</text><g><line x1="180" y1="343" x2="180" y2="359" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,359 L176.5,352 L183.5,352 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="361" width="336" height="55" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="384" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">extract</text><text x="24" y="406" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">greedy DAG, priced by cost.fused</text><g><line x1="180" y1="416" x2="180" y2="432" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,432 L176.5,425 L183.5,425 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="434" width="336" height="55" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="457" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">splice</text><text x="24" y="479" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">only where the new form costs less</text><g><line x1="180" y1="489" x2="180" y2="505" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,505 L176.5,498 L183.5,498 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="507" width="336" height="36" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="530" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">outer jit lowers → XLA</text><text x="12" y="569" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">dew.algebra.passes(on, target), on by default;</text><text x="12" y="591" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">loop bodies rewritten in place</text></svg>
