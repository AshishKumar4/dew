<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 360 672" width="360" height="672" role="img" aria-label="The compile-time algebra pass. The traced jaxpr&#x27;s arithmetic becomes terms, the rest opaque leaves; windows form around each head a rule can cheapen, and each cluster of them saturates under facts and the identities, linear and joined rule sets within a budget; egglog&#x27;s greedy DAG extraction picks each form by its price in seconds, or XLA&#x27;s cost analysis of the window where only rewrites XLA makes itself reach a root; a region&#x27;s forms go in only where it costs less, and the outer jit lowers the result for XLA."><title>The compile-time algebra pass. The traced jaxpr&#x27;s arithmetic becomes terms, the rest opaque leaves; windows form around each head a rule can cheapen, and each cluster of them saturates under facts and the identities, linear and joined rule sets within a budget; egglog&#x27;s greedy DAG extraction picks each form by its price in seconds, or XLA&#x27;s cost analysis of the window where only rewrites XLA makes itself reach a root; a region&#x27;s forms go in only where it costs less, and the outer jit lowers the result for XLA.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="12" y="12" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="35" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">traced jaxpr</text><text x="24" y="57" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">the whole step,</text><text x="24" y="76" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">backward included</text><g><line x1="180" y1="86" x2="180" y2="102" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,102 L176.5,95 L183.5,95 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="104" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="127" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">terms</text><text x="24" y="149" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">language equations become terms;</text><text x="24" y="168" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">the rest stay opaque</text><g><line x1="180" y1="178" x2="180" y2="194" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,194 L176.5,187 L183.5,187 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="196" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="219" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">windows</text><text x="24" y="241" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">each cheapenable head, two producer</text><text x="24" y="260" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">levels; clusters of 64 equations</text><g><line x1="180" y1="270" x2="180" y2="286" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,286 L176.5,279 L183.5,279 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="288" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="311" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">saturate</text><text x="24" y="333" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">each cluster its own e-graph:</text><text x="24" y="352" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">identities, linear, joined</text><g><line x1="180" y1="362" x2="180" y2="378" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,378 L176.5,371 L183.5,371 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="380" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="403" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">extract</text><text x="24" y="425" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">greedy DAG, priced by cost.fused</text><text x="24" y="444" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">(XLA&#x27;s own for its rewrites)</text><g><line x1="180" y1="454" x2="180" y2="470" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,470 L176.5,463 L183.5,463 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="472" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="495" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">splice</text><text x="24" y="517" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">a region&#x27;s forms, where the</text><text x="24" y="536" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">region costs less</text><g><line x1="180" y1="546" x2="180" y2="562" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,562 L176.5,555 L183.5,555 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="564" width="336" height="36" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="587" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">outer jit lowers → XLA</text><text x="12" y="626" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">dew.algebra.passes(on, target), on by default;</text><text x="12" y="648" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">loop bodies rewritten in place</text></svg>
