<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 360 732" width="360" height="732" role="img" aria-label="The derivation of a Reduction: the declaration is traced at one tile into terms, facts mark the walked sums and maxima, the step, merge and finish readings saturate under the decoupled rules, and extraction priced by the tile walk yields init, step, merge and finish, or refuses. The switch dew._cache.DERIVED, off by default, chooses the derived forms or the hand-written ones for the template&#x27;s plain_step, merge and finish."><title>The derivation of a Reduction: the declaration is traced at one tile into terms, facts mark the walked sums and maxima, the step, merge and finish readings saturate under the decoupled rules, and extraction priced by the tile walk yields init, step, merge and finish, or refuses. The switch dew._cache.DERIVED, off by default, chooses the derived forms or the hand-written ones for the template&#x27;s plain_step, merge and finish.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="12" y="12" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="35" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">declaration</text><text x="24" y="57" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">a Reduction:</text><text x="24" y="76" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">softmax(s)·v by keys</text><g><line x1="180" y1="86" x2="180" y2="102" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,102 L176.5,95 L183.5,95 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="104" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="127" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">traced at a tile</text><text x="24" y="149" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">terms; facts mark</text><text x="24" y="168" font-size="13" font-weight="400" text-anchor="start" style="fill:var(