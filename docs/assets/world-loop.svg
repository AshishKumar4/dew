<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 440 316" width="440" height="316" role="img" aria-label="One loop. What the policy reads goes in, the policy&#x27;s action goes to a step, and the step answers with the next thing to read and a reward. The step can be a simulator&#x27;s physics, whose state is the cartpole and whose observation is five numbers, or a world model&#x27;s prior, whose state is a latent and whose answer is the latent feature, h and z joined. The same scan runs both."><title>One loop. What the policy reads goes in, the policy&#x27;s action goes to a step, and the step answers with the next thing to read and a reward. The step can be a simulator&#x27;s physics, whose state is the cartpole and whose observation is five numbers, or a world model&#x27;s prior, whose state is a latent and whose answer is the latent feature, h and z joined. The same scan runs both.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--