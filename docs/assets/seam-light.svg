<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8c959f"/></marker></defs>
  <rect x="24" y="24" width="460" height="68" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1.25"/>
  <text x="42" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#1f2328">ObjectiveTrainer</text>
  <text x="42" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">mesh, compiled step, optimizer, EMA, checkpoints, logging</text>
  <rect x="716" y="24" width="460" height="68" rx="8" fill="#e6fbf7" stroke="#2fb8a8" stroke-width="1.25"/>
  <text x="734" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#1f2328">Objective</text>
  <text x="734" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#59636e">init_params, loss, make_validation_step, log_validation_artifacts</text>
  <text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">at start</text>
  <text x="120" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">init_params(rng)</text>
  <line x1="500" y1="118" x2="700" y2="118" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">parameter tree, any number of modules</text>
  <text x="24" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">every step</text>
  <text x="120" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">loss(params, ema_params, batch, rng, step)</text>
  <line x1="500" y1="152" x2="700" y2="152" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">scalar loss and a dict of metrics</text>
  <text x="24" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">each epoch</text>
  <text x="120" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">make_validation_step()(val_state, batch)</text>
  <line x1="500" y1="186" x2="700" y2="186" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">artifacts: samples, embeddings, text</text>
  <text x="24" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">each epoch</text>
  <text x="120" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#1f2328">log_validation_artifacts(wandb, artifacts, step)</text>
  <line x1="500" y1="220" x2="700" y2="220" stroke="#8c959f" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">what the artifacts look like in the run</text>
  <text x="24" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start">Implementations: DiffusionObjective, JepaObjective, LMObjective. The trainer treats all three the same way.</text>
</svg>
