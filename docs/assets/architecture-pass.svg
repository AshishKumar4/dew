<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 760 332" width="760" height="332" role="img" aria-label="The compile-time algebra pass. The traced jaxpr&#x27;s arithmetic becomes terms, the rest opaque leaves; windows form around each head a rule can cheapen; facts and the identities and linear rule sets saturate within a budget; egglog&#x27;s greedy DAG extraction picks each form by its price in seconds; a form is spliced in only where it costs less, and the outer jit lowers the result for XLA."><title>The compile-time algebra pass. The traced jaxpr&#x27;s arithmetic becomes terms, the rest opaque leaves; windows form around each head a rule can cheapen; facts and the identities and linear rule sets saturate within a budget; egglog&#x27;s greedy DAG extraction picks each form by its price in seconds; a form is spliced in only where it costs less, and the outer jit lowers the result for XLA.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="16" y="16" width="170" height="84" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="28" y="39" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">traced jaxpr</text><text x="28" y="61" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">the whole step,</text><text x="28" y="80" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">backward included</text><rect x="204" y="16" width="260" height="84" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="216" y="39" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">terms</text><text x="216" y="61" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">language equations become terms;</text><text x="216" y="80" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">the rest stay opaque</text><rect x="482" y="16" width="262" height="84" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="494" y="39" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">windows</text><text x="494" y="61" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">each cheapenable head with two</text><text x="494" y="80" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">producer levels; 64 equations</text><rect x="16" y="140" width="240" height="84" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="28" y="163" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">saturate</text><text x="28" y="185" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">facts, identities, linear,</text><text x="28" y="204" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">round by round, in a budget</text><rect x="274" y="140" width="220" height="84" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="286" y="163" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">extract</text><text x="286" y="185" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">greedy DAG, each form</text><text x="286" y="204" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">priced by cost.fused</text><rect x="512" y="140" width="232" height="84" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="524" y="163" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">splice</text><text x="524" y="185" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">only where the new form</text><text x="524" y="204" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">costs less</text><rect x="16" y="262" width="478" height="54" rx="6" style="fill:none;stroke:var(--fig-rule);stroke-width:1"/><text x="28" y="284" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">switch: dew.algebra.passes(on, target), on by default</text><text x="28" y="304" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">loop bodies are rewritten in place, never unrolled</text><rect x="512" y="262" width="232" height="54" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="524" y="285" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">outer jit lowers → XLA</text><g><line x1="186" y1="58" x2="202" y2="58" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M202,58 L195,61.5 L195,54.5 z" style="fill:var(--fig-muted)"/></g><g><line x1="464" y1="58" x2="480" y2="58" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M480,58 L473,61.5 L473,54.5 z" style="fill:var(--fig-muted)"/></g><path d="M613,100 L613,120 L136,120 L136,138" style="fill:none;stroke:var(--fig-muted);stroke-width:1.25;stroke-linejoin:round;stroke-linecap:round"/><g><line x1="256" y1="182" x2="272" y2="182" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M272,182 L265,185.5 L265,178.5 z" style="fill:var(--fig-muted)"/></g><g><line x1="494" y1="182" x2="510" y2="182" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M510,182 L503,185.5 L503,178.5 z" style="fill:var(--fig-muted)"/></g><g><line x1="628" y1="224" x2="628" y2="260" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M628,260 L624.5,253 L631.5,253 z" style="fill:var(--fig-muted)"/></g></svg>
