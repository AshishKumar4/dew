<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 360 593" width="360" height="593" role="img" aria-label="One training run through Dew, top to bottom: your code, Trainer.fit, the compile (jax.jit, the algebra pass, lowering, XLA), the kernels and the GPU."><title>One training run through Dew, top to bottom: your code, Trainer.fit, the compile (jax.jit, the algebra pass, lowering, XLA), the kernels and the GPU.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="12" y="12" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="35" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer(…).fit(data)</text><text x="24" y="57" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">a script or notebook; or dew train</text><text x="24" y="76" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">run.json, the same Trainer</text><g><line x1="180" y1="86" x2="180" y2="102" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,102 L176.5,95 L183.5,95 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="104" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="127" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer.fit</text><text x="24" y="149" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">one step compiled per batch shape,</text><text x="24" y="168" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">run every micro-batch</text><g><line x1="180" y1="178" x2="180" y2="194" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,194 L176.5,187 L183.5,187 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="196" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="219" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">jax.jit</text><text x="24" y="241" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">traces the step</text><g><line x1="180" y1="251" x2="180" y2="267" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,267 L176.5,260 L183.5,260 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="269" width="336" height="55" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="292" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">algebra pass</text><text x="24" y="314" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">rewrites the jaxpr</text><g><line x1="180" y1="324" x2="180" y2="340" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,340 L176.5,333 L183.5,333 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="342" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="365" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">lower, then XLA compile</text><text x="24" y="387" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">StableHLO; fuses, runs ptxas</text><g><line x1="180" y1="397" x2="180" y2="413" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,413 L176.5,406 L183.5,406 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="415" width="336" height="74" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="438" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">kernels</text><text x="24" y="460" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">Dew&#x27;s templates, vendor kernels</text><text x="24" y="479" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">(FlashAttention, cuDNN) or XLA</text><g><line x1="180" y1="489" x2="180" y2="505" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,505 L176.5,498 L183.5,498 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="507" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="530" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">one executable per step</text><text x="24" y="552" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">kernels in order; a Mosaic launch</text><text x="24" y="571" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">may start the next early</text></svg>
