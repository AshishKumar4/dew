<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 360 843" width="360" height="843" role="img" aria-label="One training run through Dew. A script calls Trainer(objective, optax, key).fit(data), or dew train builds the same Trainer from a RunConfig. Trainer.fit compiles the step: jax.jit traces it, the algebra pass rewrites the jaxpr, it is lowered to StableHLO with kernels as custom calls, and XLA compiles it. Kernels come from Dew&#x27;s templates, vendor libraries or XLA, and run in one executable per step, where on sm90 and later a Mosaic launch may start the next early."><title>One training run through Dew. A script calls Trainer(objective, optax, key).fit(data), or dew train builds the same Trainer from a RunConfig. Trainer.fit compiles the step: jax.jit traces it, the algebra pass rewrites the jaxpr, it is lowered to StableHLO with kernels as custom calls, and XLA compiles it. Kernels come from Dew&#x27;s templates, vendor libraries or XLA, and run in one executable per step, where on sm90 and later a Mosaic launch may start the next early.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="8" y="12" width="344" height="132" rx="6" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/><rect x="16" y="20" width="328" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="28" y="43" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer(…).fit(data)</text><text x="28" y="65" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">a script or notebook</text><rect x="16" y="81" width="328" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="28" y="104" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">or: dew train run.json</text><text x="28" y="126" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">RunConfig builds the same Trainer</text><g><line x1="180" y1="144" x2="180" y2="160" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,160 L176.5,153 L183.5,153 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="162" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="185" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer.fit</text><text x="24" y="207" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">compiles a step per batch shape,</text><text x="24" y="226" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">runs it every micro-batch</text><g><line x1="180" y1="236" x2="180" y2="252" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,252 L176.5,245 L183.5,245 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="254" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="277" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">jax.jit</text><text x="24" y="299" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">traces the step</text><g><line x1="180" y1="309" x2="180" y2="325" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,325 L176.5,318 L183.5,318 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="327" width="336" height="55" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="350" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">algebra pass</text><text x="24" y="372" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">rewrites the jaxpr</text><g><line x1="180" y1="382" x2="180" y2="398" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,398 L176.5,391 L183.5,391 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="400" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="423" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">lower</text><text x="24" y="445" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">StableHLO</text><g><line x1="180" y1="455" x2="180" y2="471" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,471 L176.5,464 L183.5,464 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="473" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="496" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">XLA compile</text><text x="24" y="518" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">fuses, runs ptxas</text><g><line x1="180" y1="528" x2="180" y2="544" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,544 L176.5,537 L183.5,537 z" style="fill:var(--fig-muted)"/></g><rect x="8" y="546" width="344" height="193" rx="6" style="fill:none;stroke:var(--fig-muted);stroke-width:1"/><rect x="16" y="554" width="328" height="55" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="28" y="577" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Dew&#x27;s templates</text><text x="28" y="599" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">Mosaic GPU, Triton, TPU</text><rect x="16" y="615" width="328" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="28" y="638" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">vendor kernels</text><text x="28" y="660" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">FlashAttention, cuDNN</text><rect x="16" y="676" width="328" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="28" y="699" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">XLA</text><text x="28" y="721" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">fusions, cuBLAS</text><g><line x1="180" y1="739" x2="180" y2="755" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,755 L176.5,748 L183.5,748 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="757" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="780" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">one executable per step</text><text x="24" y="802" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">its kernels run in order; from sm90 a</text><text x="24" y="821" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">Mosaic launch may start the next early</text></svg>
