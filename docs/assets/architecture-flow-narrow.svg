<svg xmlns="http://www.w3.org/2000/svg" class="dew-figure" viewBox="0 0 360 828" width="360" height="828" role="img" aria-label="One training run through Dew. A script calls Trainer(objective, optax, key).fit(data), or dew train builds the same Trainer from a RunConfig. Trainer.fit compiles the step: jax.jit traces it, it is lowered to StableHLO with kernels as custom calls, and XLA compiles it; the algebra pass, which rewrites the traced step&#x27;s math between tracing and lowering, is on base/kernels. Kernels come from Dew&#x27;s templates, vendor libraries or XLA, and run in one executable per step."><title>One training run through Dew. A script calls Trainer(objective, optax, key).fit(data), or dew train builds the same Trainer from a RunConfig. Trainer.fit compiles the step: jax.jit traces it, it is lowered to StableHLO with kernels as custom calls, and XLA compiles it; the algebra pass, which rewrites the traced step&#x27;s math between tracing and lowering, is on base/kernels. Kernels come from Dew&#x27;s templates, vendor libraries or XLA, and run in one executable per step.</title><style>.dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf;--fig-sans:var(--sl-font,Geist, Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif);--fig-mono:var(--sl-font-mono,'Geist Mono', 'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace)}@media (prefers-color-scheme:dark){.dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}}:root[data-theme=light] .dew-figure,html[theme=light] .dew-figure,body[data-jp-theme-light=true] .dew-figure,body.vscode-light .dew-figure{--fig-text:#16282b;--fig-muted:#4d6763;--fig-rule:#c9d9d5;--fig-surface:#f2f6f5;--fig-raised:#ffffff;--fig-accent:#0b7d71;--fig-accent-fill:#d3f1ec;--fig-warm:#b45f06;--fig-warm-fill:#f8e3c8;--fig-tint0:#cdeee8;--fig-tint1:#d6e6f5;--fig-tint2:#e6ddf3;--fig-tint3:#f5e6cf}:root[data-theme=dark] .dew-figure,html[theme=dark] .dew-figure,body[data-jp-theme-light=false] .dew-figure,body.vscode-dark .dew-figure{--fig-text:#d8e5e2;--fig-muted:#93aba7;--fig-rule:#243639;--fig-surface:#0f191c;--fig-raised:#131f23;--fig-accent:#2fb8a8;--fig-accent-fill:#0b3531;--fig-warm:#f2b45a;--fig-warm-fill:#4a3416;--fig-tint0:#12433d;--fig-tint1:#1d3a52;--fig-tint2:#3f3358;--fig-tint3:#4f3a22}@media (prefers-reduced-motion:reduce){.dew-figure *{animation:none!important}}</style><rect x="12" y="12" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="35" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer(…).fit(data)</text><text x="24" y="57" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">a script or notebook</text><g><line x1="180" y1="67" x2="180" y2="83" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,83 L176.5,76 L183.5,76 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="85" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="108" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">or: dew train run.json</text><text x="24" y="130" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">RunConfig builds the same Trainer</text><g><line x1="180" y1="140" x2="180" y2="156" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,156 L176.5,149 L183.5,149 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="158" width="336" height="74" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="181" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Trainer.fit</text><text x="24" y="203" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">compiles a step per batch shape,</text><text x="24" y="222" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">runs it every micro-batch</text><g><line x1="180" y1="232" x2="180" y2="248" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,248 L176.5,241 L183.5,241 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="250" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="273" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">jax.jit</text><text x="24" y="295" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">traces the step</text><g><line x1="180" y1="305" x2="180" y2="321" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,321 L176.5,314 L183.5,314 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="323" width="336" height="55" rx="6" style="fill:var(--fig-warm-fill);stroke:var(--fig-warm);stroke-width:1"/><text x="24" y="346" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">algebra pass</text><text x="24" y="368" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">on base/kernels</text><g><line x1="180" y1="378" x2="180" y2="394" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,394 L176.5,387 L183.5,387 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="396" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="419" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">lower</text><text x="24" y="441" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">StableHLO</text><g><line x1="180" y1="451" x2="180" y2="467" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,467 L176.5,460 L183.5,460 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="469" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="492" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">XLA compile</text><text x="24" y="514" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">fuses, runs ptxas</text><g><line x1="180" y1="524" x2="180" y2="540" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,540 L176.5,533 L183.5,533 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="542" width="336" height="55" rx="6" style="fill:var(--fig-accent-fill);stroke:var(--fig-accent);stroke-width:1"/><text x="24" y="565" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">Dew&#x27;s templates</text><text x="24" y="587" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">Mosaic GPU, Triton, TPU</text><g><line x1="180" y1="597" x2="180" y2="613" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,613 L176.5,606 L183.5,606 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="615" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="638" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">vendor kernels</text><text x="24" y="660" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">FlashAttention, cuDNN</text><g><line x1="180" y1="670" x2="180" y2="686" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,686 L176.5,679 L183.5,679 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="688" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="711" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">XLA</text><text x="24" y="733" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">fusions, cuBLAS</text><g><line x1="180" y1="743" x2="180" y2="759" style="stroke:var(--fig-muted);stroke-width:1.25"/><path d="M180,759 L176.5,752 L183.5,752 z" style="fill:var(--fig-muted)"/></g><rect x="12" y="761" width="336" height="55" rx="6" style="fill:var(--fig-surface);stroke:var(--fig-rule);stroke-width:1"/><text x="24" y="784" font-size="14" font-weight="600" text-anchor="start" style="fill:var(--fig-text);font-family:var(--fig-mono)">one executable per step</text><text x="24" y="806" font-size="13" font-weight="400" text-anchor="start" style="fill:var(--fig-muted);font-family:var(--fig-sans)">its kernels run in order</text></svg>
