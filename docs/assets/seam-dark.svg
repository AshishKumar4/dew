<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img">
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker></defs>
  <rect x="24" y="24" width="460" height="68" rx="8" fill="#161b22" stroke="#30363d" stroke-width="1.25"/>
  <text x="42" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">Trainer</text>
  <text x="42" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">mesh, compiled step, optimizer, EMA, checkpoints, tracker</text>
  <rect x="716" y="24" width="460" height="68" rx="8" fill="#0f2a27" stroke="#2fb8a8" stroke-width="1.25"/>
  <text x="734" y="54" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="600" fill="#e6edf3">Objective</text>
  <text x="734" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1">inputs, ema, init, loss, evaluate</text>
  <text x="24" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">at start</text>
  <text x="120" y="123" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">init(key)</text>
  <line x1="500" y1="118" x2="700" y2="118" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="123" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">variables tree, any number of modules</text>
  <text x="24" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">every step</text>
  <text x="120" y="157" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">loss(params, batch, step)</text>
  <line x1="500" y1="152" x2="700" y2="152" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="157" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">scalar loss and an Aux of metrics</text>
  <text x="24" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">every eval_every</text>
  <text x="120" y="191" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">evaluate(params, batch, step)</text>
  <line x1="500" y1="186" x2="700" y2="186" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="191" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">typed artifacts: images, text, token scores</text>
  <text x="24" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">every eval_every</text>
  <text x="120" y="225" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#e6edf3">metric.reduce(scored)</text>
  <line x1="500" y1="220" x2="700" y2="220" stroke="#6e7681" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="716" y="225" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">one val/&lt;name&gt; per metric</text>
  <text x="24" y="284" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" fill="#9198a1" text-anchor="start">Implementations: DiffusionObjective, JepaObjective, LMObjective. The trainer treats all three the same way.</text>
</svg>
