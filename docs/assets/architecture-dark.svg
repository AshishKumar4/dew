  <text x="40" y="198" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1" xml:space="preserve">(data, fsdp) mesh, jit with donation, one compile per run</text>
