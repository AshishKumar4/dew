  <text x="40" y="486" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#9198a1" xml:space="preserve">UNet, UNet3D, UViT, DiT, MMDiT, SSM-DiT,</text>
