[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dewml"
dynamic = ["version"]
description = "A JAX/Flax framework for training diffusion, JEPA and other large models from scratch"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name="Ashish Kumar Singh", email="ashishkmr472@gmail.com" }
]
dependencies = [
    # flax.nnx imports on jax 0.11.2 from 0.12.10 on (jax.experimental.hijax's
    # HiPrim; qwix imports nnx); <0.13 so that a flax that changes linen or nnx
    # arrives through a bump the suite checks, as jax does below.
    "flax>=0.12.10,<0.13",
    # 0.11.2, whose accelerator builds the cuda12, cuda13 and tpu extras name;
    # <0.11.3 admits the post releases of the build constraints.txt names.
    # That build carries the multi-process cache-key fix (jax-ml/jax#40940),
    # which no release has: 0.11.2 keys an executable by the compiling
    # process's topology fingerprint, which differs between GPUs with and
    # without NVLink, so a pool across both kinds loaded a step on some
    # processes and compiled it on others, whose sharded autotuning then
    # waited for ever. PyPI refuses a requirement that names a URL, so the
    # published dewml takes the release: Dew detects a jax without the fix and
    # compiles a GPU pool without the persistent cache
    # (dew.training.runtime._pool_keys_alike), and CI and development installs
    # take the build through constraints.txt. A bump runs
    # tests/test_linear_attention.py::test_the_decode_kernel_steps_as_the_recurrence_does
    # and tests/test_kernels.py::test_the_decode_kernel_reads_each_row_to_its_length
    # on a GPU first: CI is CPU-only, and the gated delta net's decode kernel
    # (dew.nn.kernels.delta_rule) and the decode attention kernel
    # (dew.nn.kernels.decode_attention) are on the Pallas Triton backend JAX
    # 0.11 deprecates; each one's `fits` is its off switch.
    "jax>=0.11.2,<0.11.3",
    "optax>=0.2.2",
    "orbax-checkpoint>=0.12.4",
    "numpy",
    "pillow",
    # dew.data.images decodes, resizes and jitters every image record with it.
    "opencv-python-headless",
    "einops",
    # dew.data.dataset reads grain's private _PROCESS_KILL_TIMEOUT_S for its
    # close budget; 0.2.18 is the release that was tested.
    "grain>=0.2.18,<0.3",
    # dew.training.display: the live training display. flax already depends
    # on rich, so this names a package every install has; 13 has the
    # progress columns the display uses.
    "rich>=13",
    "tyro",
    "typing_extensions>=4.14",
    "transformers>=5.16.1",
    "jinja2",
    "filelock",
    "huggingface_hub",
]
license = "MIT"
license-files = ["LICENSE"]
keywords = ["jax", "flax", "diffusion", "language-models", "jepa", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://dewml.dev"
Documentation = "https://dewml.dev"
Repository = "https://github.com/AshishKumar4/dew"
Issues = "https://github.com/AshishKumar4/dew/issues"
Changelog = "https://github.com/AshishKumar4/dew/blob/main/CHANGELOG.md"

[project.scripts]
dew = "dew.cli.main:main"

[project.optional-dependencies]
# The accelerator builds of jax 0.11.2, installed as `dewml[cuda13]`: jax's
# own extras of the same names, repeated so that one dewml install brings the
# build; jaxlib comes from jax itself. They move with jax:
# tests/test_packaging.py compares them with the installed jax's extras.
# FlashAttention-2 (kernels/flash_attn), which attention_impl 'auto' runs on an
# A100 or an Ada GPU; its wheels are built for Linux x86_64 alone.
cuda12 = ["jax-cuda12-plugin[with-cuda]>=0.11.2,<=0.11.2",
          "dew-flash-attn-cu12~=0.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]
cuda13 = ["jax-cuda13-plugin[with-cuda]>=0.11.2,<=0.11.2",
          "dew-flash-attn-cu13~=0.1.0; sys_platform == 'linux' and platform_machine == 'x86_64'"]
tpu = ["libtpu==0.0.48.*", "requests"]
# dew.telemetry.profile reads XProf's native converters, the same in 2.23.1
# and 2.23.2. xprof 2.23.2 declares setuptools<70.0.0, which torch>=2.13's
# setuptools>=77.0.3 cannot meet; the cap is the build lock's, read into the
# wheel's requirements (openxla/xprof 496547f1), and no xprof code imports
# setuptools. So that release is skipped, and the extra installs beside torch.
profile = ["xprof>=2.23.1,!=2.23.2,<3"]
# dew.training.quantization: quantized training and serving. Qwix declares
# jax, jaxlib and flax>=0.12.0 unpinned, which the pins above satisfy.
quantization = ["qwix==0.1.8"]
test = [
    "pytest",
    # The gate's behavior tests run the same linter and rule set as CI.
    "ruff==0.14.3",
    # The legacy decoder graph test deserializes jax.export; JAX does not
    # declare flatbuffers. This version wrote the committed export fixture.
    "flatbuffers==25.12.19",
    "pytest-xdist",
    "safetensors",
    "torch",
    # A published scheduler's beta sigma grid is an inverse incomplete beta,
    # which the source scheduler also takes from scipy and refuses without.
    "scipy",
    "wandb",
    # The committed VAE fixture was generated with this reference release.
    "diffusers==0.34.0",
    # tests/test_wan_source.py cleans prompts as Wan's pipelines do (the wan extra).
    "ftfy",
    # Every decoder and MoE parity number is calibrated against this exact
    # release: the fixtures record it (tests/fixtures/hf/*/meta.json), the
    # tests cite its line numbers, and a resolve that moved it would compare
    # dew against a different reference while the tolerances stayed. The
    # library accepts this release and later; the reference suite pins it.
    "transformers==5.16.1",
    # tests/test_reference_helpers.py holds tools/kimi_k3_reference.py's MXFP4
    # encoding, this release's compressor, the one that tool's environment names.
    "compressed-tensors==0.17.1",
    # test_hf_data.py and test_online_loader.py read Hugging Face datasets,
    # unbounded so the suite runs the release `pip install dewml[streaming]`
    # installs. Both files pass on datasets 5.0.1 with pyarrow 25.0.1.
    "datasets",
    # The MLflow, TensorBoard and Optuna adapters are proven against the real
    # libraries: tests/test_reporting.py reads an MLflow run back with
    # MlflowClient and an event file back with the official accumulator, and
    # tests/test_sweep.py asks Optuna for a point. Type checking reads them too.
    "mlflow",
    "tensorboard",
    "optuna",
    # tests/test_inference_clients.py exercises the official SDK clients over a
    # mocked transport; the same pins as the inference-clients extra.
    "ollama>=0.6.2,<0.7",
    "openai>=3.8,<4",
    # tests/test_guided_decoding.py compiles regex and JSON-schema automata with it.
    "outlines-core>=0.2.14",
    # tests/test_eval_harness.py scores DewLM against lm-eval's own HFLM on the
    # same weights, and its tolerances were measured against this release;
    # HFLM imports accelerate, which the hf extra brings.
    "lm_eval[hf]==0.4.13",
    # tests/test_tools.py runs tools/run_tutorials.py, which executes the
    # tutorials through a Jupyter kernel of this interpreter.
    "nbclient",
    "nbformat",
    "ipykernel",
]
# Run mutation tests in CI, one source module at a time. Pin the operators so
# two reports describe the same mutation population.
mutation = ["cosmic-ray==8.7.0"]
# The video specs: moviepy reads the clips and brings ffmpeg (lazy imports in dew.data)
av = ["moviepy"]
# FID (scipy sqrtm) and Inception weight download
metrics = ["scipy", "requests"]
# Explicit LocalTracker.plot()/plots=True rendering.
plots = ["matplotlib"]
wandb = ["wandb"]
# MLflowTracker: a run in a tracking store, local file store included.
mlflow = ["mlflow"]
# TensorBoardTracker: an event file, written with tensorboard's own writer.
tensorboard = ["tensorboard"]
# optuna_search: the sampler behind dew.config.sweep's Optuna backend.
hpo = ["optuna"]
# Online URL-streaming loader (HF datasets-backed)
streaming = ["datasets"]
# lm-evaluation-harness task suites through dew.eval.harness.DewLM, which
# subclasses TemplateLM. Before 0.4.10, TemplateLM keeps the BOS that DewLM's
# tokenizer puts at the start of an empty-context continuation, and scores it
# as part of that continuation.
eval-harness = ["lm_eval>=0.4.10"]
# Prepared TFDS ArrayRecords; dataset preparation has its own environment.
tfds = ["tensorflow-datasets>=4.9.10"]
# Flax <-> safetensors conversion (dew.interop)
interop = ["safetensors"]
# PyTorch on the host, never for a JAX computation: unpickling pytorch_model.bin
# once into Dew's cache (dew.interop.pickles), and the tier-2 check that runs
# transformers' own model for an unregistered decoder (dew.interop.verify).
torch = ["torch"]
# Original-format single-file diffusion checkpoints (Pretrained.load(..., single_file=)):
# diffusers' own key maps, which are written in torch, convert them once.
diffusers = ["diffusers>=0.34.0", "torch"]
# Wan 2.1's pipelines clean every prompt with ftfy before UMT5 reads it, and so
# does dew.inputs.diffusion.WanConditioner.
wan = ["ftfy"]
# GGUF files (Pretrained.load(..., gguf_file=)): llama.cpp's reader and block dequantizers.
gguf = ["gguf==0.19.0"]
# Official client transports and native request/result schemas; no model runtime.
inference-clients = ["ollama>=0.6.2,<0.7", "openai>=3.8,<4"]
# examples/serve_decisions.py: a decision model behind HTTP in Jev's wire format.
serve = ["starlette>=0.40", "uvicorn>=0.30"]
# Guided decoding (dew.sampling.guided): regex and JSON-schema token automata.
guided = ["outlines-core>=0.2.14"]
# HF image processors use torchvision on the host; model computation stays JAX.
vision = ["torchvision>=0.29"]
# Pretrained.load(fallback="torchax"): transformers' PyTorch forward lowered to
# JAX. torchax 0.0.13 fails to import on torch 2.14; this nightly is the build
# the fallback's tests ran against.
torchax = ["torch>=2.14,<2.15", "torchax==0.0.14.dev20260922"]

[tool.ruff]
target-version = "py312"
# The tree's own width. A length histogram over src/dew puts p99 at 104 and
# leaves 291 of 56986 lines past 110, against 890 past 100, so 110 is the
# width the code was written to. Nothing is reflowed to reach it.
line-length = 110

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "PERF", "PIE", "RET", "SIM", "PGH",
    "ERA", "ANN401", "FBT003", "PLW0120", "RUF", "C901", "PLR0912", "PLR0915",
]
# Scripts use stdout as their interface; src/dew/ruff.toml adds T20 for the
# library, whose output is rendered by the display or reported through logging.
allowed-confusables = ["×", "γ", "σ"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-branches = 25
max-statements = 75


[tool.ruff.lint.isort]
known-first-party = ["dew"]
# The lane bootstrap must execute before JAX reads backend configuration.
force-to-top = ["lane_environment"]
# `from x import A as B, C` is one line in this tree; splitting it per alias
# turns three-name imports into three lines and hides the shared origin.
combine-as-imports = true
# A trailing comma in a wrapped import is this tree's punctuation, not a
# request for one name per line; a wrapped import that fits joins back up.
split-on-trailing-comma = false

[tool.pyright]
# The declared boundary: dew's own source, checked against the project venv.
# Vendored numeric code is included, not excluded; a checker finding is either
# a real weakness or a type that is not yet true, and both get fixed rather
# than silenced. No file list, no ignore comments, no lowered severity.
include = ["src/dew", "tools/lint_slop.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Name the environment, or two people get two counts for the same tree.
venvPath = "."
venv = ".venv"
# grain ships no py.typed, so its stubs live in stubs/: RandomMap.random_map
# and MapDataset.__getitem__ as they really are, plus the used surface.
stubPath = "stubs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" resolves the dew package from source; "." lets tests load the recipes
pythonpath = ["src", "."]
markers = [
    "network: tests that download pretrained weights from the HuggingFace Hub",
    "slow: tests that spawn real grain worker processes or drain long streams",
    "distributed: tests that need real processes with jax.distributed",
    "mesh(devices=8): tests that need that many devices; tests/conftest.py skips them, naming both device counts, on a run with fewer",
]
# A warning is a failure waiting to be reported, so the ones dew is
# responsible for are errors. The module field is matched against the module
# the warning is attributed to, which for a deprecated API is the caller, so
# these cover dew calling something that is going away as well as dew's own
# warnings. Third-party warnings stay visible and non-fatal; allowing one
# needs a line here and a reason next to it.
filterwarnings = [
    'error::DeprecationWarning:dew($|\.)',
    'error::PendingDeprecationWarning:dew($|\.)',
    'error::FutureWarning:dew($|\.)',
    # The suite is dew's code too.
    'error::DeprecationWarning:(test_|conftest)',
    'error::FutureWarning:(test_|conftest)',
    # os.fork in a process that already runs JAX threads is the deadlock this
    # suite exists to catch, so jax's own warning about it is an error
    # wherever it comes from rather than scoped to dew.
    'error:os\.fork\(\) was called:RuntimeWarning',
    # CPython warns about the same fork from multiprocessing's start method,
    # and that one is deliberately not listed. A pool forks on its own thread,
    # where an error raised by a filter is swallowed, so making it an error
    # would delete the message instead of failing the run. It has to stay
    # visible, and a test that starts a pool has to assert it never appears.
    # grain tears its worker pool down inside a multiprocessing finalizer, so
    # CPython's resource tracker reports reentrant cleanup of the pool's own
    # semaphores and shared memory. Those objects go with the worker process,
    # and dew cannot close the pool earlier because a DataLoaderIterator has
    # no close(). Ignored rather than shown, because nothing stays in the tail
    # of a green run, and scoped to the tracker so a leak of ours still
    # speaks. Counted 44 of them in the grain worker tests.
    'ignore:ResourceTracker called reentrantly:UserWarning:multiprocessing\.resource_tracker',
    'ignore:resource_tracker:UserWarning:multiprocessing\.resource_tracker',
    # Qwix 0.1.8 aliases a flax name flax removed; scoped to qwix so the same
    # warning from dew's own code still fails the run.
    'ignore:.VariableState. was removed:DeprecationWarning:qwix',
]

[tool.setuptools.dynamic]
version = {attr = "dew.__version__"}

[tool.setuptools.package-data]
dew = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dew*"]
