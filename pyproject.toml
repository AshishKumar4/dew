[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dewml"
dynamic = ["version"]
description = "A JAX/Flax framework for training diffusion, JEPA and other large models from scratch"
readme = "README.md"
requires-python = ">=3.12"
authors = [
  { name="Ashish Kumar Singh", email="ashishkmr472@gmail.com" }
]
dependencies = [
    # flax.nnx imports on jax 0.12.0.1 from 0.12.10 on (jax.experimental.hijax's
    # HiPrim; qwix imports nnx); <0.13 so that a flax that changes linen or nnx
    # arrives through a bump the suite checks, as jax does below.
    "flax>=0.12.10,<0.13",
    # Dew's JAX build: 0.12.0.1 with the fixes no release has yet (constraints.txt
    # names them), which only Dew's package index serves, pypi.dewml.dev. The
    # first build with every fix is post29; a release sorts below it, so an
    # install from PyPI alone stops at resolving jax rather than running on a
    # jax without them (docs/installation.md). The accelerator builds the
    # cuda12, cuda13 and tpu extras name are 0.12.0.1's. A bump runs the GPU
    # checks docs/installation.md lists under "Bumping JAX" first: CI is
    # CPU-only.
    "jax>=0.12.0.1.post29,<0.12.1",
    "optax>=0.2.2",
    "orbax-checkpoint>=0.12.4",
    "numpy",
    "pillow",
    # dew.data.images decodes, resizes and jitters every image record with it.
    "opencv-python-headless",
    "einops",
    # dew.nn.engram draws its bucket primes with sympy.nextprime.
    "sympy",
    # dew.nn.kv_cache's Hadamard rotation (scipy.linalg.hadamard) and dew.nn.mlp's
    # Gaussian cutoff (scipy.special.erfinv); jax already depends on scipy.
    "scipy",
    # dew.data.dataset's close budget holds grain's worker kill timeout
    # (GRAIN_KILL_SECONDS); 0.2.18 is the release that was tested.
    "grain>=0.2.18,<0.3",
    # dew.training.display: the live training display. flax already depends
    # on rich, so this names a package every install has; 13 has the
    # progress columns the display uses.
    "rich>=13",
    "tyro",
    "typing_extensions>=4.14",
    "transformers>=5.16.1",
    "jinja2",
    "filelock",
    "huggingface_hub",
    "fsspec>=2026.6.0",
    # dew.data.sources.urls fetches HTTP(S) through fsspec's aiohttp session under aiohttp's total deadline.
    "aiohttp>=3.9",
    "zstandard>=0.25.0",
    "gcsfs>=2026.6.0",
    "s3fs>=2026.6.0",
    "pyarrow>=25.0.1",
    "array-record>=0.8.3; sys_platform != 'win32'",
    # dew.nn.kernels.tuning: every Pallas launch is a tokamax Op, whose config
    # is measured per GPU model and shape. 0.0.13 and 0.0.14 pin
    # typeguard==2.13.3, which tyro excludes.
    "tokamax>=0.0.15",
]
license = "MIT"
# Third-party code Dew carries keeps its notice: each file translated or
# vendored from another project names its licence under licenses/.
license-files = ["LICENSE", "licenses/*"]
keywords = ["jax", "flax", "diffusion", "language-models", "jepa", "training"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://dewml.dev"
Documentation = "https://dewml.dev"
Repository = "https://github.com/AshishKumar4/dew"
Issues = "https://github.com/AshishKumar4/dew/issues"
Changelog = "https://github.com/AshishKumar4/dew/blob/main/CHANGELOG.md"

[project.scripts]
dew = "dew.cli.main:main"

[project.optional-dependencies]
# JAX owns its accelerator requirements; the core dependency pins its release.
# FlashAttention-2 (kernels/flash_attn), which attention_impl 'auto' runs on an
# A100 or an Ada GPU; these extras install its wheels on Linux x86_64 and aarch64 (a GH200).
cuda12 = ["jax[cuda12]",
          "dew-flash-attn-cu12~=0.3.6; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]
cuda13 = ["jax[cuda13]",
          "dew-flash-attn-cu13~=0.3.6; sys_platform == 'linux' and (platform_machine == 'x86_64' or platform_machine == 'aarch64')"]
tpu = ["libtpu==0.0.50.*", "requests"]
# dew.telemetry.profile reads XProf's native converters, the same in 2.23.1
# and 2.23.2. xprof 2.23.2 declares setuptools<70.0.0, which torch>=2.13's
# setuptools>=77.0.3 cannot meet; the cap is the build lock's, read into the
# wheel's requirements (openxla/xprof 496547f1), and no xprof code imports
# setuptools. So that release is skipped, and the extra installs beside torch.
profile = ["xprof>=2.23.1,!=2.23.2,<3"]
# dew.quantization: quantized training and serving. Qwix declares
# jax, jaxlib and flax>=0.12.0 unpinned, which the pins above satisfy.
quantization = ["qwix==0.1.8"]
test = [
    "pytest",
    # tools/armada/ci.py's coverage report: branch coverage of src/dew over the suite on armada.
    "coverage",
    "moto[server,s3]>=5.1.15",
    # Delta source and publication scenarios use the optional table implementation.
    "dewml[delta]",
    # The gate's behavior tests run the same linter and rule set as CI.
    "ruff==0.14.3",
    # tools/check.sh's duplicate-code gate (tools/duplicates.py) and its red fixture run this pylint.
    "pylint==4.1.3",
    # The legacy decoder graph test deserializes jax.export; JAX does not
    # declare flatbuffers. This version wrote the committed export fixture.
    "flatbuffers==25.12.19",
    "pytest-xdist",
    # The interop suite reads and writes safetensors with its native reader.
    "dewml[interop]",
    # Reference parity and PyTorch checkpoint imports run on the host.
    "dewml[torch]",
    # A published scheduler's beta sigma grid is an inverse incomplete beta,
    # which the source scheduler also takes from scipy and refuses without.
    "scipy",
    # tests/test_reporting.py exercises the WandbTracker adapter.
    "dewml[wandb]",
    # The Diffusers references the tests run live (Flux 2's and Z-Image's transformers among them),
    # and the release the committed VAE fixture records: 0.39.0, the last that ships Diffusers' Flax
    # modules, which the Flax VAE, UNet and pipeline references read (0.40.0 removed them).
    "diffusers==0.39.0",
    # tests/test_wan_source.py cleans prompts as Wan's pipelines do (the wan extra).
    "dewml[wan]",
    # tests/test_tools.py imports FlaxDiff's reference, whose hilbert module imports matplotlib.
    "matplotlib",
    # tests/test_live_bridge.py runs the live bridge (site/live/container) over real sockets, on the
    # release its container installs (the live extra).
    "dewml[live]",
    # tests/test_notebook_display.py executes a notebook in a Jupyter kernel and reads it back saved.
    "dewml[notebooks]",
    # The reference suite runs this exact release: the fixtures that record their release
    # (tests/fixtures/hf/*/meta.json) were recorded under it, and a resolve that moved it would
    # compare Dew against a different reference unseen. The library accepts 5.16.1 and later.
    "transformers==5.17.0",
    # tests/test_reference_helpers.py holds tools/kimi_k3_reference.py's MXFP4
    # encoding, this release's compressor, the one that tool's environment names.
    "compressed-tensors==0.17.1",
    # test_hf_data.py and test_online_loader.py read Hugging Face datasets,
    # unbounded so the suite runs the release `pip install dewml[streaming]`
    # installs. Both files pass on datasets 5.0.1 with pyarrow 25.0.1.
    "dewml[streaming]",
    # The MLflow, TensorBoard and Optuna adapters are proven against the real
    # libraries: tests/test_reporting.py reads an MLflow run back with
    # MlflowClient and an event file back with the official accumulator, and
    # tests/test_sweep.py asks Optuna for a point. Type checking reads them too.
    "dewml[mlflow,tensorboard,hpo]",
    # tests/test_inference_clients.py exercises the official SDK clients over a
    # mocked transport; the same pins as the inference-clients extra.
    "dewml[inference-clients]",
    # tests/test_guided_decoding.py compiles regex and JSON-schema automata with it.
    "dewml[guided]",
    # tests/test_eval_harness.py scores DewLM against lm-eval's own HFLM on the
    # same weights, and its tolerances were measured against this release;
    # HFLM imports accelerate, which the hf extra brings.
    "lm_eval[hf]==0.4.13",
]
# Run mutation tests in CI, one source module at a time. Pin the operators so
# two reports describe the same mutation population.
mutation = ["cosmic-ray==8.7.0"]
# The video specs: moviepy reads the clips and brings ffmpeg (lazy imports in dew.data)
av = ["moviepy"]
# FID's Inception weight download
metrics = ["requests"]
wandb = ["wandb"]
# MLflowTracker: a run in a tracking store, local file store included.
mlflow = ["mlflow"]
# TensorBoardTracker: an event file, written with tensorboard's own writer.
tensorboard = ["tensorboard"]
# optuna_search: the sampler behind dew.config.sweep's Optuna backend.
hpo = ["optuna"]
# Online URL-streaming loader (HF datasets-backed). 5.0.1 is the release the suite passes on; 4.8.5,
# Colab's, caps fsspec at 2026.2, below the 2026.6 the base needs, and unbounded pip backtracks from
# it to datasets 1.6.2, whose metadata it can't read.
streaming = ["datasets>=5.0.1"]
# The live site's container (site/live/container/setup-managed.sh), beside the streaming and profile
# extras: its bridge's WebSocket release, the kernel gateway and IPython kernel its contexts run, and
# ipywidgets, without which tqdm warns in a kernel that it falls back to text bars. The test extra
# holds it, so locks/cpu.txt, which the container installs under, pins every one.
live = ["websockets==17.1", "jupyter-kernel-gateway==3.0.1", "ipykernel", "ipywidgets"]
delta = ["deltalake>=1.0"]
# dew.data.text's curation steps (Language, Quality, Classifier, Decontaminated): DataTrove's language,
# quality, fastText and n-gram decontamination filters. DataTrove splits English into words with a blank
# spaCy pipeline, which its own multilingual extra brings beside TensorFlow; spaCy alone is enough here.
curation = ["datatrove[processing]==0.10.1", "spacy>=3.8.2"]
# lm-evaluation-harness task suites through dew.eval.harness.DewLM, which
# subclasses TemplateLM. Before 0.4.10, TemplateLM keeps the BOS that DewLM's
# tokenizer puts at the start of an empty-context continuation, and scores it
# as part of that continuation.
eval-harness = ["lm_eval>=0.4.10"]
# Prepared TFDS ArrayRecords; dataset preparation has its own environment.
# tensorflow-datasets 4.9.10 checks paths against `importlib_resources.abc.Traversable`
# (core/utils/resource_utils, through etils' lazy imports) but declares the
# backport for Python < 3.9 only, so a 3.12 environment lacks it; it goes when
# tfds declares it or reads importlib.resources.
tfds = ["tensorflow-datasets>=4.9.10", "importlib_resources"]
# Flax <-> safetensors conversion (dew.interop)
interop = ["safetensors"]
# PyTorch on the host, never for a JAX computation: unpickling pytorch_model.bin
# once into Dew's cache (dew.interop.pickles), and the tier-2 check that runs
# transformers' own model for an unregistered decoder (dew.interop.verify).
torch = ["torch"]
# Original-format single-file diffusion checkpoints (Pretrained.load(..., single_file=)):
# diffusers' own key maps, which are written in torch, convert them once.
diffusers = ["diffusers>=0.34.0", "torch"]
# Wan 2.1's pipelines clean every prompt with ftfy before UMT5 reads it, and so
# does dew.inputs.diffusion.WanConditioner.
wan = ["ftfy"]
# GGUF files (Pretrained.load(..., gguf_file=)): llama.cpp's reader and block dequantizers.
gguf = ["gguf==0.19.0"]
# Official client transports and native request/result schemas; no model runtime.
inference-clients = ["ollama>=0.6.2,<0.7", "openai>=3.14,<4"]
# examples/serve_decisions.py: a decision model behind HTTP in Jev's wire format.
serve = ["starlette>=0.40", "uvicorn>=0.30"]
# Agent environments and remote sandboxes for rollouts: OpenEnv's environments and the Modal, E2B and
# Daytona SDKs, which dew.interop's environment and sandbox adapters import when they are used.
environments = ["openenv>=0.9,<0.10", "modal>=1.6,<1.7", "e2b>=2,<3", "daytona>=0.224,<0.226"]
# Guided decoding (dew.sampling.guided): regex and JSON-schema token automata.
guided = ["outlines-core>=0.2.14"]
# HF image processors use torchvision on the host; model computation stays JAX.
vision = ["torchvision>=0.29"]
# dew.data.images.Albumentations: an albumentations pipeline as a seeded random step.
augment = ["albumentations>=2"]
# Pretrained.load(fallback="torchax"): transformers' PyTorch forward lowered to
# JAX. torchax 0.0.13 fails to import on torch 2.14; this nightly is the build
# the fallback's tests ran against.
torchax = ["torch>=2.14,<2.15", "torchax==0.0.14.dev20260922"]
# tests/kernel_compile.py compiles every declared Pallas kernel config for each GPU generation with the
# compiler the GPU runs, XLA's CUDA backend of this jaxlib for a compile-only device (the Triton jaxlib
# bundles, CUDA's libdevice and ptxas from the nvcc wheel, which Mosaic GPU's kernels compile through
# too), and each Mosaic TPU kernel with libtpu for a compile-only TPU, on a host with no accelerator:
# locks/cpu.txt takes this extra, and a GPU host's lock has its own CUDA plugin already
# (tools/lock_environment.sh).
kernel-compile = ["jax-cuda12-plugin==0.12.0.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
                  "jax-cuda12-pjrt==0.12.0.1; sys_platform == 'linux' and platform_machine == 'x86_64'",
                  "nvidia-cuda-nvcc-cu12~=12.9; sys_platform == 'linux' and platform_machine == 'x86_64'",
                  "libtpu==0.0.50.*; sys_platform == 'linux' and platform_machine == 'x86_64'"]
# The test suite's one environment: every package a test file imports, so no test skips for want
# of one. CI's jobs, armada's (tools/armada/install.sh), the GPU nodes' and dew-ops' GPU jobs install
# it under constraints.txt, locked in locks/ (tools/lock_environment.sh).
ci = ["dewml[test,av,tfds,metrics,inference-clients,serve,environments,vision,augment,quantization,profile,torchax,gguf,curation]",
      "flake8"]
# The tutorial notebooks' environment outside Colab: the extras they import and a Jupyter kernel.
# Tutorial 01, Diffusion from scratch, draws with matplotlib, which Colab installs.
tutorials = ["dewml[streaming,interop,notebooks]", "matplotlib"]
# Execute notebooks through a Jupyter kernel of the selected interpreter.
notebooks = ["nbclient", "nbformat", "ipykernel"]

# The least uv: 0.13.4 is the first whose own CA store leaves out emSign's (GHSA-hq85-5cpj-mr62). uv refuses
# to run older in this project, setup-uv installs a release at least this, and site/scripts/gen_install.py
# writes it into the installers that bootstrap uv before any checkout (install.sh, tools/armada/setup.sh, dew
# tpu setup's script) and into the installation advice.
[tool.uv]
required-version = ">=0.13.4"

[tool.ruff]
target-version = "py312"
# The tree's own width. A length histogram over src/dew puts p99 at 104 and
# leaves 291 of 56986 lines past 110, against 890 past 100, so 110 is the
# width the code was written to. Nothing is reflowed to reach it.
line-length = 110

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "C4", "PERF", "PIE", "RET", "SIM", "PGH",
    "ERA", "ANN401", "FBT003", "PLW0120", "RUF", "C901", "PLR0912", "PLR0915",
]
# Scripts use stdout as their interface; src/dew/ruff.toml adds T20 for the
# library, whose output is rendered by the display or reported through logging.
allowed-confusables = ["×", "γ", "σ"]

[tool.ruff.lint.mccabe]
max-complexity = 25

[tool.ruff.lint.pylint]
max-branches = 25
max-statements = 75


[tool.ruff.lint.isort]
known-first-party = ["dew"]
# conftest sets the lane's environment (lane_environment.configured) before JAX reads it.
force-to-top = ["lane_environment"]
# `from x import A as B, C` is one line in this tree; splitting it per alias
# turns three-name imports into three lines and hides the shared origin.
combine-as-imports = true
# A trailing comma in a wrapped import is this tree's punctuation, not a
# request for one name per line; a wrapped import that fits joins back up.
split-on-trailing-comma = false

[tool.pyright]
# The declared boundary: dew's own source, checked against the project venv.
# Vendored numeric code is included, not excluded; a checker finding is either
# a real weakness or a type that is not yet true, and both get fixed rather
# than silenced. No file list, no ignore comments, no lowered severity.
include = ["src/dew", "tools/lint_slop.py"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
# Name the environment, or two people get two counts for the same tree.
venvPath = "."
venv = ".venv"
# grain ships no py.typed, so its stubs live in stubs/: RandomMap.random_map
# and MapDataset.__getitem__ as they really are, plus the used surface.
stubPath = "stubs"

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" resolves the dew package from source; "." lets tests load the recipes
pythonpath = ["src", "."]
markers = [
    "network: tests that download pretrained weights from the HuggingFace Hub",
    "slow: tests that spawn real grain worker processes or drain long streams",
    "distributed: tests that need real processes with jax.distributed",
    "mesh(devices=8): tests that need that many devices; tests/conftest.py skips them, naming both device counts, on a run with fewer",
    "gpu(reason): tests only a cuda device runs; tests/conftest.py skips them on any other backend, and a GPU session runs them with -m gpu",
    "tpu(reason): tests only a tpu runs; tests/conftest.py skips them on any other backend, and the TPU tier (dew-ops' dewops.node.tpu, a Colab TPU at main's tip after each train) runs them with -m tpu",
    "torchax: tests whose code imports torchax, which renames torch's privateuse1 backend process-wide; CI runs these files in tasks of their own (tools/armada/ci.py)",
    "kernel: tests of a GPU kernel's code (Pallas, Triton, fla): the CPU suite lowers and interprets them, and the kernel lab's GPU tier runs every one, with every gpu test, on each target GPU before the kernel lands, but for check 1 on the TPU SSD kernel, which no user runs on a GPU",
]
# A warning is a failure waiting to be reported, so the ones dew is
# responsible for are errors. The module field is matched against the module
# the warning is attributed to, which for a deprecated API is the caller, so
# these cover dew calling something that is going away as well as dew's own
# warnings. Third-party warnings stay visible and non-fatal; allowing one
# needs a line here and a reason next to it.
filterwarnings = [
    'error::DeprecationWarning:dew($|\.)',
    'error::PendingDeprecationWarning:dew($|\.)',
    'error::FutureWarning:dew($|\.)',
    # The suite is dew's code too.
    'error::DeprecationWarning:(test_|conftest)',
    'error::FutureWarning:(test_|conftest)',
    # os.fork in a process that already runs JAX threads is the deadlock this
    # suite exists to catch, so jax's own warning about it is an error
    # wherever it comes from rather than scoped to dew.
    'error:os\.fork\(\) was called:RuntimeWarning',
    # CPython warns about the same fork from multiprocessing's start method,
    # and that one is deliberately not listed. A pool forks on its own thread,
    # where an error raised by a filter is swallowed, so making it an error
    # would delete the message instead of failing the run. It has to stay
    # visible, and a test that starts a pool has to assert it never appears.
    # grain tears its worker pool down inside a multiprocessing finalizer, so
    # CPython's resource tracker reports reentrant cleanup of the pool's own
    # semaphores and shared memory. Those objects go with the worker process,
    # and dew cannot close the pool earlier because a DataLoaderIterator has
    # no close(). Ignored rather than shown, because nothing stays in the tail
    # of a green run, and scoped to the tracker so a leak of ours still
    # speaks. Counted 44 of them in the grain worker tests.
    'ignore:ResourceTracker called reentrantly:UserWarning:multiprocessing\.resource_tracker',
    'ignore:resource_tracker:UserWarning:multiprocessing\.resource_tracker',
    # Qwix 0.1.8 aliases a flax name flax removed; scoped to qwix so the same
    # warning from dew's own code still fails the run.
    'ignore:.VariableState. was removed:DeprecationWarning:qwix',
    # jaxlib 0.12.0.1 builds the native type of a trace event's stats with no __module__ the first time a
    # process reads one, and CPython warns of it in the reading frame, dew.telemetry.trace's: raised there,
    # the error above aborts the process natively. Shown, not raised, for that message in that module
    # alone; it goes once jaxlib gives the type a module.
    'default:builtin type event_stats has no __module__ attribute:DeprecationWarning:dew\.telemetry\.trace',
]

[tool.coverage.run]
# tools/armada/ci.py coverage: every task's data names src/dew's files relative to its checkout, so the
# report combines tasks that ran in other containers, and the Python processes a test starts are measured
# too, each into its own file. The core stays the default: sys.monitoring has no branches before 3.14.
branch = true
relative_files = true
source = ["src/dew"]
parallel = true
patch = ["subprocess"]
concurrency = ["thread", "multiprocessing"]

[tool.setuptools.dynamic]
version = {attr = "dew.__version__"}

[tool.setuptools.package-data]
dew = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["dew*"]
